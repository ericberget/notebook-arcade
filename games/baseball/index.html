<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Ballpark</title>
<link href="../../shared/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #37251b; overflow: hidden; font-family: 'Patrick Hand', cursive; }
  body { background: linear-gradient(#160c0630,#160c0645), url('../../assets/student-desk-v1.webp') center / cover no-repeat; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #stage { position: relative; width: 1200px; height: 720px; transform-origin: top left; }
  #stage { isolation:isolate; box-shadow: 3px 5px 4px #100905a6, 10px 20px 18px #1009058c, 20px 35px 48px #10090599; }
  #stage:before { content:""; position:absolute; inset:3px -2px -5px 2px; z-index:-1; background:repeating-linear-gradient(0deg,#b5aa92 0 1px,#e9dfca 1px 3px); border-radius:1px 2px 3px 2px; }
  #binding { position:absolute; left:-48px; top:14px; width:82px; height:692px; display:flex; flex-direction:column; justify-content:space-around; pointer-events:none; z-index:3; }
  #binding span { display:block; width:82px; height:40px; flex-shrink:0; transform:scaleX(.72); transform-origin:right center; background:url('../../assets/notebook-wire-v1.png') -18px -24px / 120px 80px no-repeat; filter:drop-shadow(1px 2px 1px #10090555); }
  #stage:after { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(90deg,#72634b66,#fff9e688); pointer-events:none; }
  canvas { display: block; cursor: crosshair; touch-action: none; }

  button, #back { font-family: 'Patrick Hand', cursive; font-size: 18px; background: transparent; border: 2px solid #9a9aa0; color: #7a7a82; padding: 3px 12px; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; cursor: pointer; transform: rotate(1deg); }
  button:hover { background: rgba(80,80,90,.07); }
  button:disabled { opacity: .35; cursor: default; }
  #back { border: none; border-bottom: 2px solid #9a9aa0; border-radius: 0; text-decoration: none; padding: 6px 10px; transform: rotate(-1.5deg); }
  #top { position: absolute; left: 84px; top: 14px; }
  #sys { position: absolute; left: 84px; top: 610px; display: flex; flex-direction: column; gap: 9px; align-items: flex-start; }
  #mute { padding: 4px 8px 1px; line-height: 0; }
  #side { position: absolute; left: 950px; top: 300px; width: 230px; display: flex; flex-direction: column; gap: 8px; }
  #side .label { font-size: 16px; color: #4a4a4f; opacity: .65; }
  #pitches { display: none; flex-wrap: wrap; gap: 6px; }
  #pitches.on { display: flex; }
  #pitches button { color: #1f3d9e; border-color: #1f3d9e; font-size: 17px; }
  #pitches button.sel { background: rgba(31,61,158,.12); }
  #swing-button { color:#c0392b; border-color:#c0392b; font-size:32px; margin:10px 0; padding:6px; }
  #swing-button[hidden] { display:none; }
  #hint { font-size: 16px; color: #4a4a4f; opacity: .7; line-height: 1.25; }
  #side, #sys, #top { transition: opacity .7s; }
  #stage.intro #side, #stage.intro #sys, #stage.intro #top { opacity: 0; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1200" height="720"></canvas>
  <div id="binding" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div id="top"><a href="../../index.html" id="back">← arcade</a></div>
  <div id="sys"><button id="mute" title="sound" aria-label="sound on"></button><button id="newgame">new game</button></div>
  <div id="side">
    <div class="label" id="pitchLabel">pick a pitch, then click a spot in the zone</div>
    <div id="pitches"><button data-p="fast">fastball</button><button data-p="curve">curve</button><button data-p="change">changeup</button></div>
    <button id="swing-button" aria-label="Swing bat">SWING!</button>
    <div id="hint"></div>
    <button id="howto">how to play</button>
  </div>
</div></div>
<script src="../../shared/paper.js?v=binding-2"></script>
<script src="../../shared/ink.js"></script>
<script>
const W = 1200, H = 720;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ink = NotebookInk(ctx); const { INK, RED, GRAPHITE } = ink;
const PEN_LT = '#9a9aa0', PEN_MD = '#7a7a82', PEN_DK = '#4a4a50', DIRT = '#b58a5a';
const stage = document.getElementById('stage');
function fit() { const rim = window.innerWidth < 700 ? 10 : 40; const s = Math.min((window.innerWidth - rim * 2) / (W + 52), (window.innerHeight - rim * 2) / H); stage.style.transform = `scale(${s})`; stage.style.marginLeft = ((window.innerWidth - (W + 52) * s) / 2 + 52 * s) + 'px'; stage.style.marginTop = ((window.innerHeight - H * s) / 2) + 'px'; }
window.addEventListener('resize', fit); fit();
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
NotebookPaper.draw(paper.getContext('2d'), W, H, 'plain');

// ---------- the diamond ----------
const HOME = { x: 560, y: 612 }, BASE_D = 118;
const BASES = [HOME, { x: HOME.x + BASE_D, y: HOME.y - BASE_D }, { x: HOME.x, y: HOME.y - 2 * BASE_D }, { x: HOME.x - BASE_D, y: HOME.y - BASE_D }];
const MOUND = { x: HOME.x, y: HOME.y - 150 }, FENCE_R = 440;
const FIELD_SPOTS = { P: MOUND, C: { x: HOME.x, y: HOME.y + 30 }, '1B': { x: HOME.x + 150, y: HOME.y - 140 }, '2B': { x: HOME.x + 60, y: HOME.y - 232 }, SS: { x: HOME.x - 60, y: HOME.y - 232 }, '3B': { x: HOME.x - 150, y: HOME.y - 140 }, LF: { x: HOME.x - 215, y: HOME.y - 330 }, CF: { x: HOME.x, y: HOME.y - 395 }, RF: { x: HOME.x + 215, y: HOME.y - 330 } };
const GRAV = 0.32, FIELDER_SPD = 3.1, RUNNER_SPD = 2.9;

// ---------- sound ----------
const SFX = (() => {
  let ac, master, noiseBuf, muted = false, crowdGain;
  function init() { if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const cr = ac.createBufferSource(); cr.buffer = noiseBuf; cr.loop = true; const cf = ac.createBiquadFilter(); cf.type = 'lowpass'; cf.frequency.value = 450; crowdGain = ac.createGain(); crowdGain.gain.value = 0.025; cr.connect(cf).connect(crowdGain).connect(master); cr.start(); }
  const now = () => ac.currentTime;
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(type, f0, f1, dur, vol, t = now(), lp) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = ac.createGain(); env(g, t, 0.004, vol, dur); let n = o; if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; } n.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05); }
  function noise(dur, vol, t = now(), o = {}) { const n = ac.createBufferSource(); n.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1; f.frequency.setValueAtTime(o.f0 || 1000, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur); const g = ac.createGain(); env(g, t, o.attack || 0.003, vol, dur); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.05); }
  return {
    resume() { init(); if (ac.state === 'suspended') ac.resume(); },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7; return muted; },
    crowd(l) { if (!ac) return; crowdGain.gain.setTargetAtTime(0.025 + l * 0.12, now(), 0.25); },
    crack(p = 1) { if (!ac || muted) return; const t = now(), strength = Math.max(.2, Math.min(1.5,p)); noise(0.026, .22 + strength*.17, t, { type:'highpass', f0:1800 }); tone('triangle', 410, 390, .035, .13*strength, t, 2100); tone('sine', 165, 145, .065, .24*strength, t); },
    pop() { if (!ac || muted) return; const t = now(); noise(0.05, 0.45, t, { f0: 700, f1: 250, q: 1 }); tone('sine', 180, 70, 0.08, 0.3, t); },
    whiff() { if (!ac || muted) return; noise(0.2, 0.25, now(), { f0: 900, f1: 2600, q: 1, attack: 0.05 }); },
    strike() { if (!ac || muted) return; const t = now(); tone('sawtooth', 300, 220, 0.16, 0.18, t, 900); },
    ball() { if (!ac || muted) return; tone('sine', 520, 440, 0.1, 0.1); },
    out() { if (!ac || muted) return; const t = now(); tone('sawtooth', 260, 180, 0.3, 0.16, t, 700); },
    hit(big) { if (!ac || muted) return; const t = now(); [523, 659, 784].forEach((f, i) => tone('triangle', f, f, 0.3, 0.16, t + i * 0.08)); if (big) { [1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.8, 0.16, t + 0.3 + i * 0.1)); this.crowd(1); setTimeout(() => this.crowd(0), 2500); } else { this.crowd(0.4); setTimeout(() => this.crowd(0), 1200); } },
    click() { if (!ac || muted) return; noise(0.03, 0.2, now(), { f0: 2500, q: 5 }); },
    pencil() { if (!ac || muted) return; const t = now(); for (let i = 0; i < 3; i++) noise(0.12, 0.07, t + i * 0.13, { f0: 2800 + Math.random() * 1200, q: 1.5, attack: 0.03 }); },
    win() { if (!ac || muted) return; const t = now(); [[262, 330, 392], [294, 370, 440], [330, 415, 494], [392, 494, 587, 784]].forEach((ch, i) => ch.forEach(f => tone('triangle', f, f, 0.5, 0.14, t + i * 0.25))); },
  };
})();

// ---------- game state ----------
let game, frame = 0, introT = 9999; const INTRO_LEN = 150;
const rv = (s, d) => Math.max(0, Math.min(1, (introT - s) / d));
let state = 'idle';           // 'pitching' (ball on the way) | 'play' (ball in play) | 'between' | 'pencilsAB' (waiting for the CPU) | 'over'
let pitch = null, play = null, msg = null, swing = null, pitchType = 'fast', mouse = { x: 0, y: 0 }, aimSpot = null, fielders = {}, runnersAnim = [], note = '';
const hintEl = document.getElementById('hint'), pitchesEl = document.getElementById('pitches'), pitchLabel = document.getElementById('pitchLabel');
let teamName = (localStorage.getItem('bb.team') || 'YOU').slice(0, 10);
let popups = [], bursts = [], trail = [], fan = { kind: 'idle', t: 0, len: 0 }, pencilIdx = 0;
const PENCIL_NAMES = ['Stubby', 'No. 2', 'Eraserhead', 'Sharpie', 'Mechanical', 'Golf Pencil', 'Chewed Tip', 'Lefty', 'Big Graphite'];
function popup(text, x, y, color = INK, size = 22) { popups.push({ text, x, y, color, size, life: 55 }); }
function burst(x, y, color) { bursts.push({ x, y, color, t: 0, seed: Math.random() * 1000 }); }
function fanDo(kind, len) { fan = { kind, t: len, len }; }
const NAME_BOX = { x: 952, y: 114, w: 110, h: 26 };
function renameTeam() {
  if (document.getElementById('rename')) return;
  const inp = document.createElement('input'); inp.id = 'rename'; inp.maxLength = 10; inp.value = teamName === 'YOU' ? '' : teamName; inp.placeholder = 'team name';
  inp.style.cssText = "position:absolute;left:958px;top:114px;width:100px;font-family:'Patrick Hand',cursive;font-size:18px;color:#4a4a50;background:#fdfbf4;border:none;border-bottom:2px solid #9a9aa0;outline:none;padding:0 2px";
  stage.appendChild(inp); inp.focus(); inp.select();
  const done = save => { if (save) { const v = inp.value.trim().slice(0, 10); teamName = v || 'YOU'; localStorage.setItem('bb.team', teamName); } inp.remove(); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
  inp.addEventListener('blur', () => done(true));
}

function newGame() {
  game = { inning: 1, half: 'top', outs: 0, balls: 0, strikes: 0, bases: [null, null, null], score: { you: 0, pencils: 0 }, line: { you: [], pencils: [] }, hits: { you: 0, pencils: 0 }, over: false };
  introT = 0; stage.classList.add('intro'); msg = null; play = null; pitch = null; swing = null; holdPlate = 0; lastContact = null; caught = null; impactPause = 0; runnersAnim = []; popups = []; bursts = []; trail = []; fan = { kind: 'idle', t: 0, len: 0 };
  resetFielders(); game.abs = 0; game.pabs = 0;
  setTimeout(() => { state = 'howto'; updateUI(); }, 2400); updateUI();
}
function batting() { return game.half === 'top'; }             // you're the visitors: you bat first, then pitch
function resetFielders() { for (const k in FIELD_SPOTS) fielders[k] = { x: FIELD_SPOTS[k].x, y: FIELD_SPOTS[k].y, tx: FIELD_SPOTS[k].x, ty: FIELD_SPOTS[k].y, id: 300 + Object.keys(fielders).length * 7 }; }
function say(text, color = INK, life = 110, sub = '') { msg = { text, color, life, sub }; }
function updateUI() {
  const b = batting();
  pitchesEl.classList.toggle('on', !b && !game.over);
  hintEl.textContent = game.over ? 'game over. new game to play again.' : state === 'howto' ? '' : b ? 'Click or press SPACE when the ball reaches the red stripe. We line up the bat for you. Let high and low pitches go.' : 'PITCHING: pick a pitch above, then click a spot inside the red zone at the plate. corners get weaker contact.';
  document.getElementById('swing-button').hidden = !b || game.over || state === 'howto';
  pitchLabel.textContent = b ? 'you\'re batting' : 'you\'re pitching';
  [...pitchesEl.querySelectorAll('button')].forEach(bt => bt.classList.toggle('sel', bt.dataset.p === pitchType));
}

// ---------- pitches ----------
const PITCHES = { fast: { spd: 2.3, sway: 0, name: 'fastball' }, curve: { spd: 1.8, sway: 46, name: 'curveball' }, change: { spd: 1.45, sway: 8, name: 'changeup' } };
function nextPitch() {
  if (game.over) return;
  if (!batting() && game.balls === 0 && game.strikes === 0 && !pitch) pencilIdx = (pencilIdx + (state === 'pitchpick' ? 0 : 1)) % PENCIL_NAMES.length;
  state = batting() ? 'batting' : 'pitchpick'; pitch = null; play = null; swing = null; aimSpot = null; runnersAnim = [];
  if (game.balls === 0 && game.strikes === 0) { if (batting()) game.abs++; else game.pabs++; }
  if (batting()) setTimeout(() => { if (state === 'batting' && !pitch) throwPitch(cpuPickPitch(), (Math.random() - .5) * 70); }, 900 + Math.random() * 900);
  updateUI();
}
function cpuPickPitch() { const r = Math.random(); return r < 0.5 ? 'fast' : r < 0.8 ? 'curve' : 'change'; }
function throwPitch(type, targetX) { // targetX: offset from the middle of the plate. |x| <= 30 is a strike
  const p = PITCHES[type]; const err = (Math.random() - .5) * (batting() ? 14 : 22);
  pitch = { type, x: MOUND.x, y: MOUND.y + 10, t: 0, wind: 26, T: (HOME.y - MOUND.y - 10) / p.spd, tx: targetX + err, spd: p.spd, sway: p.sway * (Math.random() > .5 ? 1 : -1) };
  if (batting()) { // the pencil pitcher picks a spot in or around the zone; the batter's-eye view shows it coming
    const inZ = Math.random() < 0.8, side = Math.random() > .5 ? 1 : -1;
    const fx = 0, fy = inZ ? (Math.random() - .5) * 48 : side * (70 + Math.random() * 18);
    Object.assign(pitch, { plate: true, fx, fy, drop: { fast: 0, change: 14, curve: 42 }[type], strike: Math.abs(fx) <= PV.ZW / 2 && Math.abs(fy) <= PV.ZH / 2, T: { fast: 100, curve: 115, change: 130 }[type] });
  }
  pitch.name = p.name; state = batting() ? 'batting' : 'pitching'; SFX.pencil();
}
function pitchPos(pt, t) { // where the pitch is at time t: drifts to its target, curves break late
  const u = Math.min(1, t / pt.T), late = Math.max(0, u - 0.55) / 0.45;
  return { x: MOUND.x + pt.tx * u + pt.sway * late * late, y: MOUND.y + 10 + (HOME.y - MOUND.y - 10) * u };
}

// ---------- contact ----------
function cpuSwing() { // the pencils' batter decides on your pitch
  const off = Math.abs(pitch.tx + (pitch.sway || 0) * 0.9), inZone = off <= 30;
  const swings = Math.random() < (inZone ? 0.85 : off < 55 ? 0.4 : 0.1);
  if (!swings) { pitch.result = inZone ? 'called-strike' : 'ball'; return; }
  swing = { t: 0 };
  const base = { fast: 0.62, curve: 0.5, change: 0.55 }[pitch.type];
  const contact = Math.random() < base * (inZone ? 1 : 0.55);
  if (!contact) { pitch.result = 'swing-miss'; SFX.whiff(); return; }
  const corner = Math.min(1, off / 30);
  const q = Math.random() * (1 - corner * 0.45);
  pitch.result = 'contact'; pitch.contact = { dir: -90 + (Math.random() - .5) * 96, ang: -4 + Math.random() * 60, v: 7 + q * 7 };
}

// ---------- the ball in play ----------
function launch(c) {
  SFX.crack(0.6 + (c.v - 7) / 7);
  const rad = c.dir * Math.PI / 180, a = c.ang * Math.PI / 180;
  const vz = c.v * Math.sin(a), vh = c.v * Math.cos(a);
  const z0 = 8, T = (vz + Math.sqrt(vz * vz + 2 * GRAV * z0)) / GRAV;
  const land = { x: HOME.x + Math.cos(rad) * vh * T, y: HOME.y + Math.sin(rad) * vh * T };
  const foul = c.dir > -44 || c.dir < -136;
  play = { t: 0, T, x: HOME.x, y: HOME.y, z: z0, z0, vx: Math.cos(rad) * vh, vy: Math.sin(rad) * vh, vz, land, dist: Math.hypot(land.x - HOME.x, land.y - HOME.y), foul, ang: c.ang, phase: 'flight', fielder: null, outcome: null, bounce: 0 };
  state = 'play';
  // who goes after it
  const zAtFence = fenceHeightAt(play);
  if (!foul && play.dist >= FENCE_R && zAtFence > 8) { play.outcome = { kind: 'hr' }; }
  else {
    const catchT = c.ang > 9 && vz * vz >= 2 * GRAV * (12 - z0) ? (vz + Math.sqrt(vz * vz - 2 * GRAV * (12 - z0))) / GRAV : T;
    const target = { x: HOME.x + play.vx * catchT, y: HOME.y + play.vy * catchT };
    let best = null, bd = 1e9; for (const k in fielders) { const f = fielders[k]; const d = Math.hypot(f.x - target.x, f.y - target.y); if (d < bd) { bd = d; best = k; } }
    play.fielder = best; const f = fielders[best]; f.tx = target.x; f.ty = target.y;
    const canReach = bd / FIELDER_SPD <= catchT - 4;
    if (foul) play.outcome = { kind: canReach && c.ang > 22 ? 'foulout' : 'foul' };
    else if (c.ang > 22) play.outcome = { kind: canReach ? 'flyout' : 'hit', bases: hitBases(play.dist, c.ang) };
    else if (c.ang > 9) play.outcome = { kind: bd < 46 && canReach ? 'lineout' : 'hit', bases: hitBases(play.dist, c.ang) };
    else { // grounder: an infielder tries to cut it off and beat the runner to first
      const infield = ['1B', '2B', 'SS', '3B', 'P'].map(k => ({ k, f: fielders[k] }));
      let cut = null;
      for (let t = 4; t < 90; t += 3) { const travel = Math.min(t, Math.ceil(T)) + (t > Math.ceil(T) ? .985 * (1 - Math.pow(.985, t - Math.ceil(T))) / .015 : 0); const bx = HOME.x + play.vx * travel, by = HOME.y + play.vy * travel; if (t < T) continue; if (Math.hypot(bx - HOME.x, by - HOME.y) > 300) break; for (const { k, f } of infield) { if (Math.hypot(f.x - bx, f.y - by) / FIELDER_SPD <= t) { cut = { k, t, x: bx, y: by }; break; } } if (cut) break; }
      if (cut) { const f = fielders[cut.k]; f.tx = cut.x; f.ty = cut.y; play.fielder = cut.k; const throwT = Math.hypot(cut.x - BASES[1].x, cut.y - BASES[1].y) / 9; const runnerT = 170 / RUNNER_SPD + 8; play.outcome = { kind: cut.t + 12 + throwT < runnerT ? 'groundout' : 'hit', bases: 1 }; play.cut = cut; play.throwDuration = 12 + throwT; }
      else play.outcome = { kind: 'hit', bases: play.dist > 330 ? 2 : 1 };
    }
  }
  if (['flyout', 'lineout', 'foulout'].includes(play.outcome.kind)) play.catchHeight = 12;
  // runners start moving on contact (they hold on fly balls until it drops)
  const o = play.outcome; const goes = o.kind === 'hit' || o.kind === 'hr' || o.kind === 'groundout';
  runnersAnim = []; if (goes) startRunners(o.kind === 'hr' ? 4 : o.bases || 1, o.kind === 'groundout');
}
function fenceHeightAt(p) { const th = FENCE_R / Math.hypot(p.vx, p.vy); return p.z0 + p.vz * th - 0.5 * GRAV * th * th; }
function hitBases(dist, ang) { if (dist > 400) return 3; if (dist > 300) return 2; return 1; }
function startRunners(n, batterOut) {
  const runners = [];
  for (let b = 2; b >= 0; b--) if (game.bases[b]) runners.push({ from: b + 1, to: Math.min(4, b + 1 + n), id: game.bases[b] });
  if (!batterOut) runners.push({ from: 0, to: n, id: 'B' + frame });
  else runners.push({ from: 0, to: 1, id: 'B' + frame, out: true });
  runnersAnim = runners.map(r => ({ ...r, p: 0 }));
}
function resolvePlay() {
  const o = play.outcome; let text = '', color = INK, sub = '';
  const scoreFor = batting() ? 'you' : 'pencils';
  const applyRunners = (n, batterOut) => {
    const nb = [null, null, null]; let runs = 0;
    for (let b = 2; b >= 0; b--) if (game.bases[b]) { const to = b + 1 + n; if (to >= 4) runs++; else nb[to - 1] = game.bases[b]; }
    if (!batterOut) { if (n >= 4) runs++; else nb[n - 1] = 'r' + frame; }
    game.bases = nb; if (runs) { game.score[scoreFor] += runs; game.line[scoreFor][game.inning - 1] = (game.line[scoreFor][game.inning - 1] || 0) + runs; }
    return runs;
