<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<title>Eraser War</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #e9e4d6; overflow: hidden; font-family: 'Patrick Hand', cursive; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #stage { position: relative; width: 1200px; height: 720px; transform-origin: top left; }
  canvas { display: block; box-shadow: 0 10px 30px rgba(0,0,0,.25); cursor: crosshair; touch-action: none; }
  #top { position: absolute; right: 22px; top: 14px; display: flex; gap: 8px; align-items: center; }
  button, #back { font-family: 'Patrick Hand', cursive; font-size: 18px; background: rgba(251,248,238,.7); border: 2px solid #1f3d9e; color: #1f3d9e; padding: 3px 12px; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; cursor: pointer; transform: rotate(1deg); }
  button:hover { background: rgba(31,61,158,.1); }
  #back { border: none; border-bottom: 2px solid #1f3d9e; border-radius: 0; text-decoration: none; padding: 6px 10px; transform: rotate(-1.5deg); background: transparent; }
  #mute { padding: 4px 8px 1px; line-height: 0; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1200" height="720"></canvas>
  <div id="top"><a href="../../index.html" id="back">← arcade</a><button id="mute" title="sound" aria-label="sound on"></button><button id="newgame">new game</button></div>
</div></div>
<script src="../../shared/paper.js"></script>
<script src="../../shared/ink.js"></script>
<script>
const W = 1200, H = 720;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ink = NotebookInk(ctx); const { INK, RED, GRAPHITE } = ink;
const PEN_LT = '#9a9aa0', PEN_MD = '#7a7a82', PEN_DK = '#4a4a50', PINK = '#efb7c3', PINK_DK = '#c97a8e', PAPER = '#f8f5eb';
const PAPER_STYLE = 'sketchbook';   // this game's sheet: a coffee-stained sketchbook page
const stage = document.getElementById('stage');
function fit() { const s = Math.min(window.innerWidth / W, window.innerHeight / H); stage.style.transform = `scale(${s})`; stage.style.marginLeft = ((window.innerWidth - W * s) / 2) + 'px'; stage.style.marginTop = ((window.innerHeight - H * s) / 2) + 'px'; }
window.addEventListener('resize', fit); fit();
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
NotebookPaper.draw(paper.getContext('2d'), W, H, PAPER_STYLE);

// ---------- sound ----------
const SFX = (() => {
  let ac, master, noiseBuf, muted = false, windGain;
  function init() { if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const wn = ac.createBufferSource(); wn.buffer = noiseBuf; wn.loop = true; const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 500; wf.Q.value = 0.7; windGain = ac.createGain(); windGain.gain.value = 0; wn.connect(wf).connect(windGain).connect(master); wn.start(); }
  const now = () => ac.currentTime;
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(type, f0, f1, dur, vol, t = now(), lp) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = ac.createGain(); env(g, t, 0.005, vol, dur); let n = o; if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; } n.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05); }
  function noise(dur, vol, t = now(), o = {}) { const n = ac.createBufferSource(); n.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1; f.frequency.setValueAtTime(o.f0 || 1000, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur); const g = ac.createGain(); env(g, t, o.attack || 0.003, vol, dur); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.05); }
  return {
    resume() { init(); if (ac.state === 'suspended') ac.resume(); },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7; return muted; },
    wind(w) { if (!ac) return; windGain.gain.setTargetAtTime(muted ? 0 : Math.abs(w) * 0.05, now(), 0.5); },
    throw_() { if (!ac || muted) return; const t = now(); noise(0.35, 0.3, t, { f0: 400, f1: 2600, q: 1, attack: 0.05 }); tone('sine', 300, 500, 0.15, 0.12, t); },
    thud(v = 1) { if (!ac || muted) return; const t = now(); tone('sine', 140, 40, 0.22, 0.5 * v, t); noise(0.12, 0.4 * v, t, { f0: 500, f1: 120, q: 1 }); },
    rub() { if (!ac || muted) return; const t = now(); for (let i = 0; i < 5; i++) noise(0.09, 0.22, t + i * 0.07, { f0: 1800 + (i % 2) * 900, q: 1.5, attack: 0.02 }); },
    ow(hi) { if (!ac || muted) return; const t = now(); tone('square', hi ? 700 : 380, hi ? 420 : 240, 0.18, 0.1, t, 1800); tone('square', hi ? 900 : 300, hi ? 600 : 200, 0.14, 0.08, t + 0.1, 1800); },
    click() { if (!ac || muted) return; noise(0.03, 0.2, now(), { f0: 2500, q: 5 }); },
    fall() { if (!ac || muted) return; tone('sawtooth', 500, 150, 0.35, 0.12, now(), 900); },
    win() { if (!ac || muted) return; const t = now(); [[262, 330, 392], [294, 370, 440], [330, 415, 494], [392, 494, 587, 784]].forEach((ch, i) => ch.forEach(f => tone('triangle', f, f, 0.5, 0.14, t + i * 0.25))); },
    lose() { if (!ac || muted) return; const t = now(); [[392, 0], [370, 0.35], [349, 0.7], [330, 1.05]].forEach(([f, d]) => tone('sawtooth', f, f * 0.97, 0.4, 0.14, t + d, 900)); },
    scratch() { if (!ac || muted) return; const t = now(); for (let i = 0; i < 12; i++) noise(0.14, 0.05, t + i * 0.16, { f0: 2600 + Math.random() * 1400, q: 1.5, attack: 0.03 }); },
  };
})();

// ---------- world ----------
const GRAV = 0.26, WINDK = 0.028;
let ground = new Float32Array(W + 2), tufts = new Uint8Array(W + 2);
let you, pen, state = 'intro', turn = 1, wind = 0, frame = 0, introT = 0, proj = null, particles = [], popups = [], scrawls = [], craters = [], shake = 0, mouse = { x: 600, y: 300 }, bubble = null, throwAnim = null, aiPlan = null, waitT = 0, winner = null, theme = 'farm', windmill = null, baseSeed = 1, pageNo = 1;
const rv = (s, d) => Math.max(0, Math.min(1, (introT - s) / d));
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const terrainCv = document.createElement('canvas'); terrainCv.width = W; terrainCv.height = H;
let seed = 1; const rnd = () => { const x = Math.sin(seed++ * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }; const rj = a => (rnd() - 0.5) * a;

function newGame() {
  baseSeed = Math.floor(Math.random() * 100000); seed = baseSeed; theme = ['farm', 'town', 'castle'][Math.floor(rnd() * 3)]; pageNo = 1 + Math.floor(rnd() * 40);
  turn = 1; proj = null; particles = []; popups = []; scrawls = []; craters = []; bubble = null; throwAnim = null; aiPlan = null; winner = null; windmill = null; introT = 0; state = 'intro';
  buildGround(); buildBackground(); renderTerrain();
  you = { x: 175, hp: 100, dir: 1, y: 0, vy: 0, wob: 0, face: 'grin' }; pen = { x: 1025, hp: 100, dir: -1, y: 0, vy: 0, wob: 0, face: 'smug' };
  you.y = groundAt(you.x); pen.y = groundAt(pen.x);
  wind = 0; newWind(); SFX.scratch();
  setTimeout(() => { if (state === 'intro') startTurn('you'); }, 3200);
}
function groundAt(x) { return ground[Math.max(0, Math.min(W, Math.round(x)))]; }
function newWind() { wind = Math.round((Math.random() * 2 - 1) * 12) / 10; SFX.wind(wind); }

// the hills: a couple of sines, a big bump (or dip) in the middle, flat pads under each fighter
function buildGround() {
  seed = baseSeed + 3;
  const a = 30 + rnd() * 30, b = 12 + rnd() * 18, p1 = rnd() * 6.28, p2 = rnd() * 6.28, base = 500 + rnd() * 40, bumpH = rnd() < 0.6 ? 60 : -30;
  for (let x = 0; x <= W + 1; x++) {
    let y = base + Math.sin(x / 260 + p1) * a + Math.sin(x / 90 + p2) * b + Math.sin(x / 37) * 5 - Math.exp(-Math.pow((x - 600) / 150, 2)) * bumpH;
    for (const px of [175, 1025]) { const d = Math.abs(x - px); if (d < 60) { const t = d / 60; y = y * t + (base + 10) * (1 - t); } }
    ground[x] = Math.max(340, Math.min(640, y));
  }
  for (let k = 0; k < 3; k++) for (let x = 1; x < W; x++) ground[x] = (ground[x - 1] + ground[x] * 2 + ground[x + 1]) / 4;
  for (let x = 0; x <= W + 1; x++) tufts[x] = 1;
}

// ---------- pencil vocabulary (same hand as the slingshot's scenery) ----------
// depth: 0 = far (faint, thin), 1 = near (darker, thicker)
function pline(g, x1, y1, x2, y2, depth = 1, passes = 2) {
  g.strokeStyle = GRAPHITE; g.lineCap = 'round';
  for (let i = 0; i < passes; i++) { g.globalAlpha = 0.2 + depth * 0.42; g.lineWidth = 0.8 + depth * 0.9; const mx = (x1 + x2) / 2 + rj(3), my = (y1 + y2) / 2 + rj(3); g.beginPath(); g.moveTo(x1 + rj(2), y1 + rj(2)); g.quadraticCurveTo(mx, my, x2 + rj(2), y2 + rj(2)); g.stroke(); }
  g.globalAlpha = 1;
}
function penPath(g, pts, depth = 1, close = false) { for (let i = 0; i < pts.length - (close ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; pline(g, a.x, a.y, b.x, b.y, depth); } }
function penCircle(g, cx, cy, r, depth = 1, passes = 2) {
  g.strokeStyle = GRAPHITE; g.globalAlpha = 0.2 + depth * 0.42; g.lineWidth = 0.8 + depth * 0.9;
  for (let p = 0; p < passes; p++) { g.beginPath(); const st = rnd() * 6.28; for (let i = 0; i <= 26; i++) { const t = st + i / 25 * Math.PI * 2, rr = r + rj(2.5); const x = cx + Math.cos(t) * rr, y = cy + Math.sin(t) * rr; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  g.globalAlpha = 1;
}
// soft side-of-the-pencil shading inside a polygon
function smudge(g, pts, strength = 0.08, angle = -0.6, gap = 4) {
  g.save(); g.beginPath(); pts.forEach((v, i) => i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)); g.closePath(); g.clip();
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9; pts.forEach(v => { minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y); });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, R = Math.hypot(maxX - minX, maxY - minY) / 2 + 6, dx = Math.cos(angle), dy = Math.sin(angle), nx = -dy, ny = dx;
  g.strokeStyle = '#6b6b70'; g.lineWidth = 5; g.globalAlpha = strength;
  for (let o = -R; o <= R; o += gap) { g.beginPath(); g.moveTo(cx + nx * o - dx * R + rj(3), cy + ny * o - dy * R); g.lineTo(cx + nx * o + dx * R, cy + ny * o + dy * R + rj(3)); g.stroke(); }
  g.restore(); g.globalAlpha = 1;
}
function penText(g, str, x, y, size, depth = 0.6, rot = 0, align = 'center') { g.save(); g.translate(x, y); g.rotate(rot); g.font = `400 ${size}px 'Patrick Hand', cursive`; g.textAlign = align; g.fillStyle = GRAPHITE; g.globalAlpha = 0.25 + depth * 0.5; g.fillText(str, 0, 0); g.restore(); g.globalAlpha = 1; }
// --- occlusion: whatever is nearer gets filled with the page itself, so it covers what's behind it
// (a pencil drawing hides what's behind an object; see-through outlines read as a wireframe, not a drawing)
function paperPat(g) { return g._pp || (g._pp = g.createPattern(paper, 'repeat')); }
function mask(g, pts) { g.save(); g.beginPath(); pts.forEach((v, i) => i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)); g.closePath(); g.fillStyle = paperPat(g); g.fill(); g.restore(); }
function maskCircle(g, cx, cy, r) { g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fillStyle = paperPat(g); g.fill(); g.restore(); }
function cloud(g, x, y, w, depth) {
  const bumps = 5, pts = []; for (let i = 0; i <= bumps; i++) pts.push({ x: x + (i / bumps) * w, y: y - Math.sin((i / bumps) * Math.PI) * w * 0.35 + rj(4) });
  g.save(); g.beginPath(); g.moveTo(x - 4, y + 4);
  for (let i = 0; i < bumps; i++) { const a = pts[i], b = pts[i + 1], r = Math.hypot(b.x - a.x, b.y - a.y) / 2 + 4; g.arc((a.x + b.x) / 2, (a.y + b.y) / 2, r, Math.PI, 0); }
  g.lineTo(x + w + 4, y + 4); g.closePath(); g.fillStyle = paperPat(g); g.fill(); g.restore();
  for (let i = 0; i < bumps; i++) { const a = pts[i], b = pts[i + 1]; const r = Math.hypot(b.x - a.x, b.y - a.y) / 2 + 4; g.strokeStyle = GRAPHITE; g.globalAlpha = 0.2 + depth * 0.34; g.lineWidth = 1 + depth * 0.6; g.beginPath(); g.arc((a.x + b.x) / 2, (a.y + b.y) / 2, r, Math.PI, 0); g.stroke(); }
  pline(g, x - 4, y + 4, x + w + 4, y + 4, depth); smudge(g, [...pts, { x: x + w, y: y + 4 }, { x, y: y + 4 }], 0.05, -0.5, 5); g.globalAlpha = 1;
}
function tree(g, x, baseY, h, depth) {
  const foot = baseY + 14;   // the trunk carries on under the ground; the clip cuts it at the line
  mask(g, [{ x: x - 2.5, y: foot }, { x: x + 2.5, y: foot }, { x: x + 2.5, y: baseY - h * 0.3 }, { x: x - 2.5, y: baseY - h * 0.3 }]);
  pline(g, x, foot, x, baseY - h * 0.25, depth);
  for (let t = 0; t < 3; t++) {   // bottom tier first: each tier above covers the one below
    const yTop = baseY - h * (0.35 + t * 0.25), yBot = baseY - h * (0.15 + t * 0.25), hw = h * (0.32 - t * 0.07);
    const tri = [{ x, y: yTop }, { x: x + hw, y: yBot }, { x: x - hw, y: yBot }];
    mask(g, tri); penPath(g, tri, depth, true); smudge(g, [tri[0], tri[1], { x, y: yBot }], 0.09, 1.0, 4);
  }
}
function roundTree(g, x, baseY, h, depth) {
  const cx = x, cy = baseY - h * 0.65, r = h * 0.32;
  mask(g, [{ x: x - 3, y: baseY + 14 }, { x: x + 3, y: baseY + 14 }, { x: x + 3, y: cy }, { x: x - 3, y: cy }]); pline(g, x, baseY + 14, x + rj(3), baseY - h * 0.4, depth);
  maskCircle(g, cx, cy, r + 2);
  g.strokeStyle = GRAPHITE; g.globalAlpha = 0.15 + depth * 0.3; g.lineWidth = 1; g.beginPath(); for (let i = 0; i < 70; i++) { const t = i * 0.5, rr = r * (0.6 + rnd() * 0.5); const px = cx + Math.cos(t) * rr, py = cy + Math.sin(t) * rr * 0.85; i ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); g.globalAlpha = 1;
  penCircle(g, cx, cy, r, depth, 1);
}
function flock(g, x, y, n, depth) { for (let i = 0; i < n; i++) { const bx = x + i * 16 + rj(8), by = y + (i % 2) * 6 + rj(4); pline(g, bx - 7, by - 3, bx, by + 1, depth, 1); pline(g, bx, by + 1, bx + 7, by - 3, depth, 1); } }
function house(g, x, baseY, w, h, depth, redRoof) {
  const foot = baseY + 22;   // walls run into the ground and get cut at the ridge
  const body = [{ x, y: foot }, { x: x + w, y: foot }, { x: x + w, y: baseY - h }, { x, y: baseY - h }];
  const roof = [{ x: x - 6, y: baseY - h }, { x: x + w / 2, y: baseY - h - w * 0.45 }, { x: x + w + 6, y: baseY - h }];
  const chim = rnd() < 0.6, cx = x + w * 0.75;
  if (chim) { const ch = [{ x: cx, y: baseY - h - 1 }, { x: cx + 8, y: baseY - h - 1 }, { x: cx + 8, y: baseY - h - 22 }, { x: cx, y: baseY - h - 22 }]; mask(g, ch); penPath(g, ch, depth, true); }
  mask(g, body); mask(g, roof);
  penPath(g, body, depth, true); penPath(g, roof, depth);
  if (redRoof) { g.strokeStyle = RED; g.globalAlpha = 0.32; g.lineWidth = 1.2; g.beginPath(); for (let i = 0; i < 12; i++) { g.moveTo(x - 4 + i * (w + 8) / 12, baseY - h); g.lineTo(x + w / 2 + rj(4), baseY - h - w * 0.45 + 5); } g.stroke(); g.globalAlpha = 1; } else smudge(g, roof, 0.1, 0.9, 4);
  smudge(g, [{ x: x + w * 0.6, y: foot }, { x: x + w, y: foot }, { x: x + w, y: baseY - h }, { x: x + w * 0.6, y: baseY - h }], 0.06, -0.6, 5);
  const ww = Math.min(12, w * 0.2); for (const wx of [x + w * 0.2, x + w * 0.62]) penPath(g, [{ x: wx, y: baseY - h * 0.65 }, { x: wx + ww, y: baseY - h * 0.65 }, { x: wx + ww, y: baseY - h * 0.65 + ww }, { x: wx, y: baseY - h * 0.65 + ww }], depth, true);
  penPath(g, [{ x: x + w * 0.42, y: foot }, { x: x + w * 0.42, y: baseY - h * 0.4 }, { x: x + w * 0.56, y: baseY - h * 0.4 }, { x: x + w * 0.56, y: foot }], depth);
  if (chim) for (let s = 0; s < 3; s++) penCircle(g, cx + 6 + s * 5, baseY - h - 32 - s * 9, 4 + s * 2, depth * 0.5, 1);
}

// ---------- scenery: sky, two mountain ranges, a mid ridge with one of three little worlds on it ----------
function buildBackground() {
  const g = bg.getContext('2d'); g.clearRect(0, 0, W, H); g._pp = null; seed = baseSeed + 17;
  const night = rnd() < 0.22;
  const midPts = []; for (let i = 0; i <= 24; i++) midPts.push({ x: i * (W / 24), y: 440 + Math.sin(i * 0.9 + 2) * 22 + Math.sin(i * 0.4) * 14 + rj(5) });
  const midY = x => { const i = Math.min(23, Math.max(0, Math.floor(x / (W / 24)))), a = midPts[i], b = midPts[i + 1]; return a.y + (b.y - a.y) * ((x - a.x) / (b.x - a.x)); };
  // --- sky
  if (night) {
    maskCircle(g, 1040, 180, 36); penCircle(g, 1040, 180, 34, 0.45); g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(1056, 170, 30, 0, 7); g.fill(); g.restore();
    for (let i = 0; i < 24; i++) { const sx = 100 + rnd() * 1000, sy = 135 + rnd() * 180, r = 2 + rnd() * 2; pline(g, sx - r, sy, sx + r, sy, 0.3, 1); pline(g, sx, sy - r, sx, sy + r, 0.3, 1); }
  } else {
    const sx = rnd() < 0.5 ? 150 + rnd() * 160 : 900 + rnd() * 140, sy = 175 + rnd() * 30;
    for (let i = 0; i < 16; i++) { const a = i / 16 * 6.28 + rj(0.2); pline(g, sx + Math.cos(a) * 50, sy + Math.sin(a) * 50, sx + Math.cos(a) * (70 + rj(16)), sy + Math.sin(a) * (70 + rj(16)), 0.4, 1); }
    maskCircle(g, sx, sy, 46);
    g.strokeStyle = GRAPHITE; g.globalAlpha = 0.32; g.lineWidth = 1.3; g.beginPath(); for (let i = 0; i < 120; i++) { const t = i * 0.35, r = 3 + i * 0.28 + rj(3); const x = sx + Math.cos(t) * r, y = sy + Math.sin(t) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.globalAlpha = 1;
  }
  for (let i = 0, n = 3 + Math.floor(rnd() * 3); i < n; i++) cloud(g, 80 + rnd() * 900, 165 + rnd() * 90, 90 + rnd() * 110, 0.2 + rnd() * 0.35);
  flock(g, 300 + rnd() * 600, 150 + rnd() * 80, 4 + Math.floor(rnd() * 3), 0.35);
  if (rnd() < 0.6) { const bx = 250 + rnd() * 600, by = 150 + rnd() * 30;
    g.save(); g.beginPath(); g.ellipse(bx, by, 46, 16, -0.04, 0, 7); g.fillStyle = paperPat(g); g.fill(); g.restore();
    g.strokeStyle = PEN_MD; g.lineWidth = 1.3; g.globalAlpha = 0.75; g.beginPath(); g.ellipse(bx, by, 44, 14, -0.04, 0, 7); g.stroke(); g.globalAlpha = 1;
    mask(g, [{ x: bx + 44, y: by - 7 }, { x: bx + 68, y: by - 8 }, { x: bx + 68, y: by + 8 }, { x: bx + 44, y: by + 7 }]);
    pline(g, bx + 44, by, bx + 66, by - 7, 0.4); pline(g, bx + 44, by, bx + 66, by + 7, 0.4); pline(g, bx + 66, by - 7, bx + 66, by + 7, 0.4);
