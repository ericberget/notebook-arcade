<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Slingshot</title>
<link href="../../shared/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #e9e4d6; overflow: hidden; font-family: 'Patrick Hand', cursive; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #stage { position: relative; width: 1200px; height: 720px; transform-origin: top left; }
  canvas { display: block; box-shadow: 0 10px 30px rgba(0,0,0,.25); cursor: crosshair; touch-action: none; }
  #hud { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); pointer-events: none; text-align: center; color: #1f3d9e; }
  #hud h1 { font-family: 'Caveat', cursive; font-size: 44px; margin: 0; letter-spacing: 1px; transform: rotate(-1.5deg); }
  #hud p { margin: 0; font-size: 22px; }
  #msg { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%) rotate(-2deg); font-family: 'Caveat', cursive; font-size: 64px; color: #c0392b; display: none; pointer-events: none; text-align: center; line-height: 1.05; }
  #msg small { display: block; font-size: 28px; font-family: 'Patrick Hand', cursive; color: #1f3d9e; }
  #buttons { position: absolute; right: 24px; top: 20px; display: flex; gap: 10px; }
  button { font-family: 'Patrick Hand', cursive; font-size: 20px; background: transparent; border: 2px solid #1f3d9e; color: #1f3d9e; padding: 4px 14px; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; cursor: pointer; transform: rotate(1deg); }
  button:hover { background: rgba(31,61,158,.08); }
  #back { font-size: 20px; color: #1f3d9e; text-decoration: none; padding: 6px 10px; transform: rotate(-1.5deg); border-bottom: 2px solid #1f3d9e; }
  #dev { position: absolute; left: 130px; top: 8px; display: none; gap: 6px; align-items: center; }
  #dev.on { display: flex; }
  #dev span { font-size: 15px; color: #4a4a4f; opacity: .7; margin-right: 4px; }
  #dev button { font-size: 16px; padding: 0 8px; min-width: 26px; border-color: #4a4a4f; color: #4a4a4f; opacity: .75; transform: rotate(-2deg); border-radius: 12px 4px 10px 5px / 5px 10px 4px 12px; }
  #dev button:nth-child(even) { transform: rotate(2deg); }
  #dev button.cur { background: rgba(192,57,43,.15); border-color: #c0392b; color: #c0392b; opacity: 1; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"><h1>Doodle Slingshot</h1><p id="stats"></p></div>
  <div id="msg"></div>
  <div id="dev"><span>dev:</span></div>
  <div id="buttons"><a href="../../index.html" id="back">← arcade</a><button id="mute">sound: on</button><button id="retry">retry</button><button id="next" style="display:none">next page →</button></div>
</div></div>
<script src="../../shared/matter.min.js"></script>
<script src="../../shared/paper.js"></script>
<script>
const { Engine, World, Bodies, Body, Events, Composite } = Matter;

const W = 1200, H = 720;
const INK = '#1f3d9e', RED = '#c0392b';
const PAPER_STYLE = 'ruled';   // this whole game lives on one sheet; other arcade games get their own paper
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const msgEl = document.getElementById('msg');
const nextBtn = document.getElementById('next');

const stage = document.getElementById('stage');
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = W; canvas.height = H;
  stage.style.transform = `scale(${s})`;
  stage.style.marginLeft = ((window.innerWidth - W * s) / 2) + 'px';
  stage.style.marginTop = ((window.innerHeight - H * s) / 2) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---------- Notebook paper background (drawn once) ----------
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
const prevPage = document.createElement('canvas'); prevPage.width = W; prevPage.height = H;
let flipEnd = 0; const FLIP_MS = 550; // page-flip animation end time (ms, performance.now clock)

function buildPaper() { NotebookPaper.draw(paper.getContext('2d'), W, H, PAPER_STYLE); }

// ---------- Sketchy ink helpers ----------
let wobbleSeed = 0;                       // changes every few frames so lines "boil" gently
function rnd(seed) { const x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }
function jit(id, k, amt) { return (rnd(id * 31 + k * 7 + wobbleSeed) - 0.5) * amt; }

function inkLine(x1, y1, x2, y2, id, color = INK, width = 2, passes = 2) {
  ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let pss = 0; pss < passes; pss++) {
    ctx.lineWidth = width * (0.8 + rnd(id + pss) * 0.4);
    ctx.globalAlpha = 0.85;
    const k = pss * 100;
    const mx = (x1 + x2) / 2 + jit(id, k + 1, 3), my = (y1 + y2) / 2 + jit(id, k + 2, 3);
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    const ov = pss ? Math.max(0, jit(id, k + 9, 8)) : 0;                    // pen overshoots the corner a little
    ctx.beginPath();
    ctx.moveTo(x1 + jit(id, k + 3, 2) - ux * ov * 0.4, y1 + jit(id, k + 4, 2) - uy * ov * 0.4);
    ctx.quadraticCurveTo(mx, my, x2 + jit(id, k + 5, 2) + ux * ov, y2 + jit(id, k + 6, 2) + uy * ov);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function inkPoly(verts, id, color = INK, width = 2) {
  for (let i = 0; i < verts.length; i++) {
    const a = verts[i], b = verts[(i + 1) % verts.length];
    inkLine(a.x, a.y, b.x, b.y, id + i * 13, color, width);
  }
}
function inkCircle(cx, cy, r, id, color = INK, width = 2) {
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let pss = 0; pss < 2; pss++) {
    ctx.lineWidth = width * (0.8 + rnd(id + pss) * 0.4); ctx.globalAlpha = 0.85;
    ctx.beginPath();
    const start = rnd(id + pss * 5) * Math.PI * 2, n = 24;
    for (let i = 0; i <= n + 1; i++) {
      const t = start + (i / n) * Math.PI * 2;
      const rr = r + jit(id, pss * 50 + i, 3);
      const x = cx + Math.cos(t) * rr, y = cy + Math.sin(t) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
// diagonal pen hatching inside a convex polygon (clip)
function hatch(verts, id, color = INK, gap = 9, angle = Math.PI / 4) {
  ctx.save();
  ctx.beginPath(); verts.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y)); ctx.closePath(); ctx.clip();
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  verts.forEach(v => { minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y); });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, R = Math.hypot(maxX - minX, maxY - minY) / 2 + 4;
  ctx.strokeStyle = color; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.55;
  const dx = Math.cos(angle), dy = Math.sin(angle), nx = -dy, ny = dx;
  let k = 0;
  for (let o = -R; o <= R; o += gap, k++) {
    const j = jit(id, k, 2);
    ctx.beginPath();
    ctx.moveTo(cx + nx * o - dx * R + j, cy + ny * o - dy * R);
    ctx.lineTo(cx + nx * o + dx * R, cy + ny * o + dy * R + j);
    ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}


// ---------- Pencil scenery (graphite, drawn once per level, static) ----------
const scenery = document.createElement('canvas'); scenery.width = W; scenery.height = H;
const GRAPHITE = '#4a4a4f';
let pr = 1; function prand() { const x = Math.sin(pr++ * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function pj(a) { return (prand() - 0.5) * a; }
// depth: 0 = far (faint, thin), 1 = near (darker, thicker)
function pen(g, x1, y1, x2, y2, depth = 1, passes = 2) {
  g.strokeStyle = GRAPHITE; g.lineCap = 'round';
  for (let i = 0; i < passes; i++) {
    g.globalAlpha = 0.18 + depth * 0.32; g.lineWidth = 0.8 + depth * 0.9;
    const mx = (x1 + x2) / 2 + pj(3), my = (y1 + y2) / 2 + pj(3);
    g.beginPath(); g.moveTo(x1 + pj(2), y1 + pj(2)); g.quadraticCurveTo(mx, my, x2 + pj(2), y2 + pj(2)); g.stroke();
  }
  g.globalAlpha = 1;
}
function penPath(g, pts, depth = 1, close = false) {
  for (let i = 0; i < pts.length - (close ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; pen(g, a.x, a.y, b.x, b.y, depth); }
}
function penCircle(g, cx, cy, r, depth = 1) {
  g.strokeStyle = GRAPHITE; g.globalAlpha = 0.18 + depth * 0.32; g.lineWidth = 0.8 + depth * 0.9;
  for (let pss = 0; pss < 2; pss++) {
    g.beginPath(); const st = prand() * 6.28;
    for (let i = 0; i <= 26; i++) { const t = st + i / 25 * Math.PI * 2, rr = r + pj(2.5); const x = cx + Math.cos(t) * rr, y = cy + Math.sin(t) * rr; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  g.globalAlpha = 1;
}
// soft graphite smudge shading inside a polygon (side-of-pencil look)
function smudge(g, pts, strength = 0.08, angle = -0.6, gap = 4) {
  g.save(); g.beginPath(); pts.forEach((v, i) => i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)); g.closePath(); g.clip();
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  pts.forEach(v => { minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y); });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, R = Math.hypot(maxX - minX, maxY - minY) / 2 + 6;
  const dx = Math.cos(angle), dy = Math.sin(angle), nx = -dy, ny = dx;
  g.strokeStyle = '#6b6b70'; g.lineWidth = 5; g.globalAlpha = strength;
  for (let o = -R; o <= R; o += gap) {
    g.beginPath(); g.moveTo(cx + nx * o - dx * R + pj(3), cy + ny * o - dy * R); g.lineTo(cx + nx * o + dx * R, cy + ny * o + dy * R + pj(3)); g.stroke();
  }
  // a few fine hatch lines on top for tooth
  g.lineWidth = 0.7; g.globalAlpha = strength * 2.2; g.strokeStyle = GRAPHITE;
  for (let o = -R; o <= R; o += gap * 2.5) {
    g.beginPath(); g.moveTo(cx + nx * o - dx * R, cy + ny * o - dy * R + pj(4)); g.lineTo(cx + nx * o + dx * R + pj(4), cy + ny * o + dy * R); g.stroke();
  }
  g.restore(); g.globalAlpha = 1;
}
function penLabel(g, text, x, y, size = 26, rot = -0.03) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.font = `${size}px 'Patrick Hand', cursive`; g.fillStyle = GRAPHITE; g.globalAlpha = 0.55; g.fillText(text, 0, 0);
  g.globalAlpha = 0.25; g.fillText(text, 0.8, 0.6); // double-stroke pencil weight
  g.restore(); g.globalAlpha = 1;
}
function cloud(g, x, y, w, depth) {
  const bumps = 5, pts = [];
  for (let i = 0; i <= bumps; i++) { pts.push({ x: x + (i / bumps) * w, y: y - Math.sin((i / bumps) * Math.PI) * w * 0.35 + pj(4) }); }
  pts.push({ x: x + w, y: y + 4 }); pts.push({ x: x, y: y + 4 });
  // bumpy top as arcs
  for (let i = 0; i < bumps; i++) { const a = pts[i], b = pts[i + 1]; const r = Math.hypot(b.x - a.x, b.y - a.y) / 2 + 4; g.strokeStyle = GRAPHITE; g.globalAlpha = 0.18 + depth * 0.3; g.lineWidth = 1 + depth * 0.6; g.beginPath(); g.arc((a.x + b.x) / 2, (a.y + b.y) / 2, r, Math.PI, 0); g.stroke(); }
  pen(g, x - 4, y + 4, x + w + 4, y + 4, depth);
  smudge(g, pts, 0.05, -0.5, 5);
}
function tree(g, x, baseY, h, depth) {
  // pine: three stacked triangles + trunk
  pen(g, x, baseY, x, baseY - h * 0.25, depth);
  for (let t = 0; t < 3; t++) {
    const yTop = baseY - h * (0.35 + t * 0.25), yBot = baseY - h * (0.15 + t * 0.25), hw = h * (0.32 - t * 0.07);
    const tri = [{ x, y: yTop }, { x: x + hw, y: yBot }, { x: x - hw, y: yBot }];
    penPath(g, tri, depth, true); smudge(g, [tri[0], tri[1], { x, y: yBot }], 0.09, 1.0, 4);
  }
}
function house(g, x, baseY, w, h, depth, roofDir = 1) {
  const body = [{ x, y: baseY }, { x: x + w, y: baseY }, { x: x + w, y: baseY - h }, { x, y: baseY - h }];
  penPath(g, body, depth, true);
  const roof = [{ x: x - 8, y: baseY - h }, { x: x + w / 2, y: baseY - h - w * 0.45 }, { x: x + w + 8, y: baseY - h }];
  penPath(g, roof, depth); smudge(g, [...roof, { x: x + w / 2, y: baseY - h }], 0.1, 0.9, 4);
  // shaded side
  smudge(g, [{ x: x + w * 0.6, y: baseY }, { x: x + w, y: baseY }, { x: x + w, y: baseY - h }, { x: x + w * 0.6, y: baseY - h }], 0.06, -0.6, 5);
  // windows + door
  const ww = Math.min(16, w * 0.22);
  for (const wx of [x + w * 0.2, x + w * 0.62]) { penPath(g, [{ x: wx, y: baseY - h * 0.7 }, { x: wx + ww, y: baseY - h * 0.7 }, { x: wx + ww, y: baseY - h * 0.7 + ww }, { x: wx, y: baseY - h * 0.7 + ww }], depth, true); pen(g, wx + ww / 2, baseY - h * 0.7, wx + ww / 2, baseY - h * 0.7 + ww, depth, 1); pen(g, wx, baseY - h * 0.7 + ww / 2, wx + ww, baseY - h * 0.7 + ww / 2, depth, 1); }
  penPath(g, [{ x: x + w * 0.42, y: baseY }, { x: x + w * 0.42, y: baseY - h * 0.45 }, { x: x + w * 0.58, y: baseY - h * 0.45 }, { x: x + w * 0.58, y: baseY }], depth);
  // chimney
  if (roofDir) { pen(g, x + w * 0.78, baseY - h - w * 0.12, x + w * 0.78, baseY - h - w * 0.32, depth); pen(g, x + w * 0.86, baseY - h - w * 0.07, x + w * 0.86, baseY - h - w * 0.32, depth); pen(g, x + w * 0.78, baseY - h - w * 0.32, x + w * 0.86, baseY - h - w * 0.32, depth); }
}
function hills(g, baseY, amp, n, depth, seedOff) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const x = (i / n) * (W + 40) - 20; const y = baseY - Math.abs(Math.sin(i * 1.7 + seedOff)) * amp - Math.sin(i * 0.6 + seedOff) * amp * 0.4; pts.push({ x, y }); }
  // draw as smooth-ish pencil curve in short segments
  for (let i = 0; i < pts.length - 1; i++) pen(g, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, depth, 1);
  smudge(g, [...pts, { x: W + 20, y: GROUND_Y }, { x: -20, y: GROUND_Y }], 0.035 + depth * 0.03, -0.35, 6);
}
function flock(g, x, y, n, depth) {
  for (let i = 0; i < n; i++) { const bx = x + i * 22 + pj(8), by = y + Math.abs(i - n / 2) * 6 + pj(4); pen(g, bx - 7, by - 3, bx, by + 1, depth, 1); pen(g, bx, by + 1, bx + 7, by - 3, depth, 1); }
}

const SCENES = [
  // Page 1: backyard - sun, clouds, rolling hills, a fence, a tree
  function backyard(g) {
    penLabel(g, 'pg. 1  —  the backyard', 128, 88, 24);
    // sun with rays
    penCircle(g, 1060, 170, 38, 0.5); smudge(g, Array.from({ length: 12 }, (_, i) => ({ x: 1060 + Math.cos(i / 12 * 6.28) * 36, y: 170 + Math.sin(i / 12 * 6.28) * 36 })), 0.05, 0.4, 5);
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; pen(g, 1060 + Math.cos(a) * 50, 170 + Math.sin(a) * 50, 1060 + Math.cos(a) * (68 + pj(10)), 170 + Math.sin(a) * (68 + pj(10)), 0.4, 1); }
    cloud(g, 300, 190, 150, 0.35); cloud(g, 640, 150, 110, 0.25); cloud(g, 820, 240, 90, 0.2);
    hills(g, 560, 70, 9, 0.2, 2.1);
    hills(g, 600, 45, 13, 0.4, 0.4);
    // fence across mid-ground
    for (let x = 140; x < 1180; x += 36) { pen(g, x, 636, x + pj(2), 596, 0.7); pen(g, x - 5, 596, x + 5, 590, 0.7, 1); pen(g, x + 5, 590, x + 5, 596, 0.7, 1); }
    pen(g, 130, 612, 1190, 610, 0.7); pen(g, 130, 626, 1190, 624, 0.7);
    // leafy tree far left behind slingshot
    pen(g, 160, 636, 158, 560, 0.8); pen(g, 158, 560, 140, 520, 0.8); pen(g, 158, 565, 180, 525, 0.8);
    for (let i = 0; i < 3; i++) penCircle(g, 160 + pj(30), 500 + pj(30), 42 + pj(14), 0.6);
    smudge(g, Array.from({ length: 14 }, (_, i) => ({ x: 160 + Math.cos(i / 14 * 6.28) * 60, y: 500 + Math.sin(i / 14 * 6.28) * 55 })), 0.07, 0.9, 5);
    flock(g, 700, 300, 4, 0.35);
  },
  // Page 2: the town - skyline of houses, water tower, street
  function town(g) {
    penLabel(g, 'pg. 2  —  downtown', 128, 88, 24);
    cloud(g, 200, 170, 120, 0.25); cloud(g, 900, 200, 140, 0.3);
    // far skyline blocks
    let x = 120;
    while (x < W) { const w = 40 + prand() * 70, h = 60 + prand() * 150; const b = [{ x, y: 600 }, { x: x + w, y: 600 }, { x: x + w, y: 600 - h }, { x, y: 600 - h }]; penPath(g, b, 0.2, true); smudge(g, b, 0.04, -0.6, 6);
      for (let wy = 600 - h + 14; wy < 590; wy += 18) for (let wx = x + 8; wx < x + w - 10; wx += 16) if (prand() > 0.4) pen(g, wx, wy, wx + 6, wy, 0.2, 1);
      x += w + 10 + prand() * 30; }
    // water tower far right
    penCircle(g, 1120, 380, 34, 0.35); pen(g, 1096, 405, 1088, 600, 0.35); pen(g, 1144, 405, 1152, 600, 0.35); pen(g, 1094, 500, 1146, 500, 0.35, 1); pen(g, 1096, 430, 1150, 560, 0.35, 1); pen(g, 1144, 430, 1090, 560, 0.35, 1);
    smudge(g, [{ x: 1086, y: 380 }, { x: 1154, y: 380 }, { x: 1154, y: 414 }, { x: 1086, y: 414 }], 0.07, -0.5, 4);
    // mid houses
    house(g, 150, 636, 120, 90, 0.75); house(g, 320, 636, 90, 70, 0.7, 0); house(g, 560, 636, 100, 80, 0.7);
    house(g, 1040, 636, 110, 95, 0.7, 0);
    // street lamp + sidewalk line
    pen(g, 470, 636, 470, 540, 0.8); pen(g, 470, 540, 490, 540, 0.8); penCircle(g, 490, 548, 7, 0.8);
    pen(g, 120, 650, 1190, 650, 0.5, 1);
    flock(g, 380, 260, 3, 0.3);
  },
  // Page 3: the mountains - jagged peaks with snow, pines, moon
  function mountains(g) {
    penLabel(g, 'pg. 3  —  up in the mountains', 128, 88, 24);
    // moon
    penCircle(g, 1040, 150, 34, 0.45);
    g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(1054, 140, 30, 0, 7); g.fill(); g.restore();
    for (let i = 0; i < 18; i++) { const sx = 200 + prand() * 900, sy = 110 + prand() * 200; pen(g, sx - 3, sy, sx + 3, sy, 0.3, 1); pen(g, sx, sy - 3, sx, sy + 3, 0.3, 1); }
    // far range
    const far = [{ x: -20, y: 560 }]; for (let i = 1; i < 10; i++) far.push({ x: i * 130, y: 300 + prand() * 140 }); far.push({ x: W + 20, y: 560 });
    penPath(g, far, 0.25); smudge(g, [...far, { x: W + 20, y: GROUND_Y }, { x: -20, y: GROUND_Y }], 0.05, -0.4, 6);
    // near range with snow caps
    const near = [{ x: -20, y: 620 }, { x: 180, y: 380 }, { x: 330, y: 540 }, { x: 460, y: 330 }, { x: 640, y: 560 }, { x: 800, y: 400 }, { x: 960, y: 590 }, { x: 1120, y: 430 }, { x: W + 20, y: 600 }];
    penPath(g, near, 0.55); smudge(g, [...near, { x: W + 20, y: GROUND_Y }, { x: -20, y: GROUND_Y }], 0.04, -0.8, 5);
    for (let i = 1; i < near.length - 1; i += 2) { const p = near[i]; // snow cap zigzag
      const l = near[i - 1], r = near[i + 1]; const t = 0.28; const a = { x: p.x + (l.x - p.x) * t, y: p.y + (l.y - p.y) * t }, b = { x: p.x + (r.x - p.x) * t, y: p.y + (r.y - p.y) * t };
      penPath(g, [a, { x: a.x + (b.x - a.x) * 0.25, y: a.y + 12 }, { x: a.x + (b.x - a.x) * 0.5, y: a.y - 4 }, { x: a.x + (b.x - a.x) * 0.75, y: b.y + 12 }, b], 0.55);
      // shaded face on right side of peak
      smudge(g, [p, r, { x: r.x, y: GROUND_Y }, { x: p.x, y: GROUND_Y }], 0.035, 1.1, 5);

function drawPopups() {
  for (const p of popups) {
    ctx.save(); ctx.translate(p.x + jit(77, p.life, 2), p.y - (55 - p.life) * 0.8); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life / 15);
    ctx.font = `700 ${p.text.length > 3 ? 30 : 34}px 'Caveat', cursive`; ctx.textAlign = 'center'; ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0); ctx.fillText(p.text, 1, 1);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function miniBird(kind, x, y, r, i) {
  inkCircle(x, y, r, 700 + i, INK, kind === 'h' ? 2.8 : 2);
  if (kind === 'h') { ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; ctx.lineWidth = 1; ctx.beginPath(); for (let k = 0; k < 8; k++) { ctx.moveTo(x - r + 2, y - r + 3 + k * 3); ctx.lineTo(x + r - 2, y + jit(700 + i, k, 8)); } ctx.stroke(); ctx.globalAlpha = 1; }
  if (kind === 'b') { inkLine(x, y - r, x + 4, y - r - 8, 720 + i, INK, 1.5, 1); inkCircle(x + 4, y - r - 9, 1.5, 730 + i, RED, 1); }
  if (kind === 's') { ctx.fillStyle = INK; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x - 4 + k * 4, y + 6, 1.2, 0, 7); ctx.fill(); } }
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x - 4, y - 3, 1.6, 0, 7); ctx.arc(x + 4, y - 3, 1.6, 0, 7); ctx.fill();
  if (kind !== 's') inkLine(x - 5, y + 4, x + 5, y + 4, 710 + i, INK, 1.5, 1);
}
function drawQueue() {
  queue.forEach((kind, i) => miniBird(kind, SLING.x - 60 - i * 34, GROUND_Y - 16, 13, i));
  // hint for the loaded bird's ability
  if (bird && !launched && bird.kind !== 'n' && !gameOver) {
    const hint = { h: 'tap in flight to SLAM', s: 'tap in flight to SPLIT', b: 'tap in flight to BOOM' }[bird.kind];
    ctx.save(); ctx.font = "22px 'Patrick Hand', cursive"; ctx.fillStyle = INK; ctx.globalAlpha = 0.6 + Math.sin(frame * 0.1) * 0.2; ctx.textAlign = 'center'; ctx.fillText(hint, SLING.x + 30, SLING.y - 70); ctx.restore(); ctx.globalAlpha = 1;
  }
}
function drawAimDots() {
  if (!dragging || !bird) return;
  const pw = bird.kind === 'h' ? 0.19 : 0.21;
  let vx = (SLING.x - bird.position.x) * pw, vy = (SLING.y - bird.position.y) * pw;
  let x = bird.position.x, y = bird.position.y;
  ctx.fillStyle = INK; ctx.globalAlpha = 0.3;
  for (let i = 0; i < 18; i++) {
    for (let s = 0; s < 3; s++) { vx *= 0.99; vy = vy * 0.99 + 0.278; x += vx; y += vy; }
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- Loop ----------
let frame = 0;
function stars(n) { return '<span style="color:#c0392b;letter-spacing:6px">' + '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(3 - n) + '</span></span>'; }
function checkState() {
  if (gameOver) return;
  if (targets.length === 0) {
    gameOver = true;
    const unused = queue.length + (bird && !launched ? 1 : 0);
    const bonus = unused * 50; score += bonus;
    const st = unused >= 2 ? 3 : unused >= 1 ? 2 : 1;
    const last = level === LEVELS.length - 1;
    if (last) {
      finale = true; SFX.finale(); SFX.drone(false); shake = 10;
      msgEl.innerHTML = `THE END<small>you finished the whole notebook!<br>final score ${score}</small>${stars(st)}`;
    } else {
      msgEl.innerHTML = `all scribbled out!<small>page ${level + 1} done · +${bonus} shot bonus · score ${score}</small>${stars(st)}`; SFX.win();
    }
    msgEl.style.display = 'block'; nextBtn.style.display = 'inline-block';
    nextBtn.textContent = last ? 'start over →' : 'next page →';
    return;
  }
  if (launched) {
    const nowT = performance.now();
    for (const f of flyers.slice()) {
      const speed = Math.hypot(f.velocity.x, f.velocity.y);
      f.restFrames = speed < 0.3 ? f.restFrames + 1 : 0;
      const off = f.position.y > H + 60 || f.position.x < -60;
      const tooLong = nowT - f.born > 8000;
      if (f.kind === 'b' && (f.restFrames > 45 || tooLong)) { explode(f); continue; }
      if (off || (speed < 0.15 && nowT - f.born > 1500) || tooLong) { World.remove(world, f); flyers = flyers.filter(x => x !== f); if (bird === f) bird = null; }
    }
    if (flyers.length === 0) {
      bird = null; launched = false;
      if (queue.length > 0) spawnBird();
      else {
        gameOver = true;
        msgEl.innerHTML = `out of ink...<small>${targets.length} doodle${targets.length > 1 ? 's' : ''} left · press retry</small>`;
        msgEl.style.display = 'block'; SFX.lose();
      }
    }
  }
}

function tick() {
  frame++;
  if (frame % 6 === 0) wobbleSeed++;
  Engine.update(engine, 1000 / 60);
  if (launched && flyers[0]) trail.push({ x: flyers[0].position.x, y: flyers[0].position.y });
  SFX.wind(launched && flyers[0] ? Math.hypot(flyers[0].velocity.x, flyers[0].velocity.y) : 0);
  particles = particles.filter(p => (p.x += p.vx, p.y += p.vy, p.vy += 0.25, --p.life > 0));
  popups = popups.filter(p => --p.life > 0);
  targets.slice().forEach(t => { if (t.position.y > H + 50) killTarget(t); });
  if (finale && frame % 4 === 0) { burst(Math.random() * W, -10, Math.random() > 0.5 ? RED : INK, 3); }
  checkState();
  shake *= 0.86; if (shake < 0.3) shake = 0;

  ctx.save();
  if (shake) ctx.translate((Math.random() - .5) * shake * 2, (Math.random() - .5) * shake * 2);
  ctx.drawImage(paper, 0, 0);
  ctx.drawImage(scenery, 0, 0);
  drawLiveScene();
  drawGround();
  drawTrail();
  drawSlingshot();
  drawQueue();
  blocks.forEach(drawBlock);
  targets.forEach(drawTarget);
  if (bird && !launched) drawBird(bird);
  flyers.forEach(drawBird);
  drawAimDots();
  drawParticles();
  drawPopups();
  ctx.restore();
  if (performance.now() < flipEnd) {
    const t = 1 - (flipEnd - performance.now()) / FLIP_MS, e = t * t;
    ctx.save();
    ctx.translate(-e * W * 1.3, -e * H * 0.6); ctx.rotate(-e * 0.7);
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetX = 20; ctx.shadowOffsetY = 20;
    ctx.globalAlpha = 1 - e * 0.3;
    ctx.drawImage(prevPage, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  statsEl.textContent = `page ${level + 1} of ${LEVELS.length}   ·   score ${score}   ·   shots left ${queue.length + (bird && !launched ? 1 : 0)}`;
  requestAnimationFrame(tick);
}

loadLevel(0);
tick();
</script>
