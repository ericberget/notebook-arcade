  #auto-design{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font:14px 'Patrick Hand',cursive;border:0;border-radius:0;padding:4px 0;min-height:30px;transform:none;color:#56647c}

<script>
const { Engine, World, Bodies, Body } = Matter;
const W = 1200, H = 720;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ink = NotebookInk(ctx); const { INK, RED, GRAPHITE } = ink;
const MATCH = window.XOMatch;
const X_COLOR = MATCH?.opponent.color || '#3a3a40';
const TEAM_COLOR = MATCH?.you.color || INK;
const opponentName = MATCH?.opponent.name || 'PENCILS';
const PEN_LT = '#9a9aa0', PEN_MD = '#7a7a82', PEN_DK = '#4a4a50';   // light / medium / bold pencil for the scoreboard column
const DOODLE = '#b4b4ba';                                              // even fainter: marginalia

// ---------- the mascot: a doodled O with arms and legs who lives in the left margin ----------
let teamName = MATCH?.you.name.toUpperCase().slice(0, 10) || (localStorage.getItem('xo.team') || 'YOU').slice(0, 10);
const NAME_BOX = { x: 76, y: 144, w: 100, h: 36 };   // where the team name sits on the scoreboard (stage coords)
function renameTeam() {
  if (MATCH) return;
  if (document.getElementById('rename')) return;
  const inp = document.createElement('input'); inp.id = 'rename'; inp.maxLength = 10; inp.value = teamName === 'YOU' ? '' : teamName; inp.placeholder = 'team name';
  stage.appendChild(inp); inp.focus(); inp.select();
  const done = save => { if (save) { const v = inp.value.trim().slice(0, 10); teamName = v || 'YOU'; localStorage.setItem('xo.team', teamName); SFX.click(); } inp.remove(); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
  inp.addEventListener('blur', () => done(true));
}
let mood = { kind: 'idle', t: 0, len: 0 };
function setMood(kind, len) { mood = { kind, t: len, len }; }
function cheer(n = 240) { setMood('cheer', n); }
function sulk() {}
function drawMascot() {
  if (firstPlayHelp) return;
  const x = 1066, baseY = 590, col = PEN_MD, w = 1.5;
  if (mood.t > 0) mood.t--; else mood.kind = 'idle';
  const k = mood.kind, el = mood.len - mood.t;                       // el: frames elapsed in the current bit
  const flip = k === 'idle' ? 0 : Math.floor(frame / 8) % 3;           // flipbook only while something is happening
  const id = 5000 + flip * 40;
  const PH = { size: 15, color: PEN_MD, font: 'Patrick Hand', weight: 400 };
  const head = (hx, hy, face, rot = 0) => {
    ink.circle(hx, hy, 13, id, col, w + 0.5, 1);
    const P = (px, py) => ({ x: hx + px * Math.cos(rot) - py * Math.sin(rot), y: hy + px * Math.sin(rot) + py * Math.cos(rot) });
    for (const ex of [-5, 5]) { const e = P(ex, -3); if (face === 'dizzy') { ink.line(e.x - 3, e.y - 3, e.x + 3, e.y + 3, id + 20 + ex, col, 1.2, 1); ink.line(e.x + 3, e.y - 3, e.x - 3, e.y + 3, id + 21 + ex, col, 1.2, 1); } else { ctx.fillStyle = PEN_DK; ctx.beginPath(); ctx.arc(e.x, e.y, 1.6, 0, 7); ctx.fill(); } }
    if (face === 'smile') { const m1 = P(-5, 3), m2 = P(0, 8), m3 = P(5, 3); ink.line(m1.x, m1.y, m2.x, m2.y, id + 3, col, 1.3, 1); ink.line(m2.x, m2.y, m3.x, m3.y, id + 4, col, 1.3, 1); }
    else if (face === 'o') ink.circle(P(0, 5).x, P(0, 5).y, 2.5, id + 3, col, 1.2, 1);
    else if (face === 'frown') { const m1 = P(-5, 7), m2 = P(0, 4), m3 = P(5, 7); ink.line(m1.x, m1.y, m2.x, m2.y, id + 3, col, 1.3, 1); ink.line(m2.x, m2.y, m3.x, m3.y, id + 4, col, 1.3, 1); }
    else { const m1 = P(-4, 5), m2 = P(4, 5); ink.line(m1.x, m1.y, m2.x, m2.y + 1, id + 3, col, 1.3, 1); }
  };
  const legs = (hx, hy, spread = 9, stride = 0) => { const l1 = { x: hx - spread + stride, y: hy + 16 }, l2 = { x: hx + spread - stride, y: hy + 16 }; ink.line(hx, hy, l1.x, l1.y, id + 7, col, w, 1); ink.line(hx, hy, l2.x, l2.y, id + 8, col, w, 1); ink.line(l1.x, l1.y, l1.x - 5, l1.y, id + 9, col, w, 1); ink.line(l2.x, l2.y, l2.x + 5, l2.y, id + 10, col, w, 1); };
  const body = (hx, hy) => { ink.line(hx, hy + 13, hx, hy + 36, id + 6, col, w, 1); legs(hx, hy + 36); return { x: hx, y: hy + 19 }; };
  const arms = (sh, a1, a2) => { ink.line(sh.x, sh.y, a1.x, a1.y, id + 11, col, w, 1); ink.line(sh.x, sh.y, a2.x, a2.y, id + 12, col, w, 1); };

  if (k === 'cheer') { // jumping, pennant waving
    const y = baseY - Math.abs(Math.sin(frame * 0.25)) * 14; head(x, y, 'smile'); const sh = body(x, y);
    const a2 = { x: x + 16, y: y - 2 + Math.sin(frame * 0.5) * 3 }; arms(sh, { x: x - 16, y: y + 2 }, a2);
    ink.line(a2.x, a2.y, a2.x + 2, a2.y - 22, id + 13, col, 1.2, 1); const f = Math.sin(frame * 0.4) * 3;
    ink.line(a2.x + 2, a2.y - 22, a2.x + 20, a2.y - 16 + f, id + 14, col, 1.2, 1); ink.line(a2.x + 20, a2.y - 16 + f, a2.x + 2, a2.y - 10, id + 15, col, 1.2, 1);
    ink.text('O', a2.x + 9, a2.y - 13 + f * 0.5, { size: 11, color: col, font: 'Patrick Hand', weight: 400 });
    if (mood.t % 40 < 20) ink.text(mood.t > 100 ? 'YEAH!!' : 'go go go', x + 44, y - 8, { ...PH, rot: -0.1 });
    return;
  }
  if (k === 'worm') { // face down, body rippling, legs kicking behind
    const gy = baseY + 46, ph = frame * 0.16;   // slow, smooth worm
    const pts = []; for (let i = 0; i <= 8; i++) { const t = i / 8; pts.push({ x: x - 34 + t * 52, y: gy - 4 + Math.sin(t * 6 - ph) * 7 }); }
    ink.path(pts, id + 30, col, w + 0.3, 1);
    const h = pts[8]; head(h.x + 12, h.y - 4 + Math.sin(ph) * 3, 'o', 0.9);
    const tail = pts[0]; ink.line(tail.x, tail.y, tail.x - 14, tail.y - 10 - Math.sin(ph) * 6, id + 31, col, w, 1); ink.line(tail.x, tail.y, tail.x - 12, tail.y + 6 + Math.sin(ph) * 5, id + 32, col, w, 1);
    ink.line(pts[5].x, pts[5].y, pts[5].x + 4, pts[5].y - 16, id + 33, col, w, 1);
    if (el < 110 || el % 70 < 40) ink.text(el < 110 ? 'worm time!' : 'oh yeah', x - 20, baseY - 6, { ...PH, size: 17, rot: -0.08 });
    return;
  }
  if (k === 'headpunt') { // pull head off, drop it, punt it out of the margin, wait for it to land back on
    const sh = body(x, baseY); const T = el;
    let hx = x, hy = baseY, face = 'frown', rot = 0, show = true;

    if(playFrame===1||playFrame%6===0)captureReplay();
    if (ball.flying) { ball.flying.t++; if (ball.flying.t >= ball.flying.T) landBall(); }
    else if (loose) {
      loose.t++;
      let best = null, bd = 1e9; for (const p of players) { if (p.team === 'x' && p.stumble > 0) continue; const d = Math.hypot(p.body.position.x - loose.x, p.body.position.y - loose.y); if (d < bd) { bd = d; best = p; } }
      if (best && bd < 16) recoverLoose(best);
      else if (loose.t > 300) { endPlay('tackle', 'dead ball', loose); loose = null; }
    }
    else if (ball.carrier) {
      const c = ball.carrier, pos = c.body.position;
      if (c.team === 'x' && pos.y >= GOAL_BOT - 2) endPlay('pick6', 'PICK SIX', pos);
      else if (c.team === 'x' && (pos.x < 2 || pos.x > FW - 2)) endPlay('int', intText(), pos);
      else if (c.team === 'o' && pos.y <= GOAL_TOP + 2) { endPlay('td', null, pos); }
      else if (pos.x < 2 || pos.x > FW - 2) endPlay('oob', 'out of bounds', pos);
      else checkContact();
    }
    if (state === 'live' && playFrame > 900) endPlay('inc', 'play blown dead', ball.carrier ? ball.carrier.body.position : { x: FW / 2, y: yardY(game.los) });
    const fy = ball.flying ? ball.flying.from.y + (ball.flying.to.y - ball.flying.from.y) * ball.flying.t / ball.flying.T : loose ? loose.y : ball.carrier ? ball.carrier.body.position.y : cam.target + 400;
    cam.target = Math.max(0, Math.min(FH - fieldViewHeight, fy - (phoneGame ? fieldViewHeight * .62 : 400)));
  } else if (state === 'result') {
    Engine.update(engine, 1000 / 60); for (const p of players) Body.setVelocity(p.body, { x: p.body.velocity.x * 0.85, y: p.body.velocity.y * 0.85 });
    if (++resultTimer > (result.kind === 'td' ? 130 : 75)) afterResult();
  } else if (state === 'fg') {
    fgAnim.t++; cam.target = Math.max(0, Math.min(FH - fieldViewHeight, yardY(game.los) - (phoneGame ? fieldViewHeight * .72 : 560)));
    if (fgAnim.t === fgAnim.T) { const mine = onOffense(); if (fgAnim.good) { game[mine ? 'you' : 'pencils'] += 3; note(`${mine ? '' : 'pencils '}${fgAnim.dist} yd field goal is GOOD. +3`, mine ? INK : RED); if (mine) SFX.good(); else { SFX.bad(); setMood('facepalm', 120); } } else { note(`${mine ? '' : 'pencils '}${fgAnim.dist} yd field goal: no good.`, mine ? RED : INK); if (mine) { SFX.bad(); setMood('facepalm', 150); } else { SFX.good(); cheer(120); } } }
    if (fgAnim.t > fgAnim.T + 70) endPossession(fgAnim.good ? 'fg' : 'kickmiss');
  }
  cam.y += (cam.target - cam.y) * (state === 'presnap' ? 1 : 0.1);
}
// fixed 60 Hz simulation regardless of how often the browser paints
let lastT = 0, acc = 0;
function tick(now = performance.now()) {
  frame++;   // (no ink.tick(): the sketch lines hold still in this game)
  if (!lastT) lastT = now; acc += Math.min(200, now - lastT); lastT = now;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }

  for (let y = 0; y < fieldViewHeight; y += H) ctx.drawImage(paper, 0, y);
  ctx.save(); ctx.beginPath(); ctx.rect(FX - 30, 0, FW + 60, fieldViewHeight); ctx.clip();
  drawField(); drawRoutes(); drawPlayers(); drawAimFinger();
  ctx.restore();
  if (introT >= 150) drawMascot();
  drawScoreboard(); drawResult(); updateMobileScore();
  requestAnimationFrame(tick);
}
// Phone UI uses the same plays, outcomes, and saved season as the desktop game.
let touchVector = null, touchLob = false, thumbPointer = null, lastMobileScore = '';
const phoneSide = document.getElementById('side'), thumbPad = document.getElementById('thumb-pad'), thumbKnob = document.getElementById('thumb-knob');
// The desktop erase button stays in place; the phone layout groups it with Run / Pass.
function placeClearButton() {
  const clear=document.getElementById('clear'), hikeButton=document.getElementById('hike'), menu=document.getElementById('mobile-menu-items');
  if(phoneGame){
    document.getElementById('play-tabs').appendChild(clear); thumbPad.appendChild(hikeButton);
    for(const id of ['mode','schemes','sys'])menu.appendChild(document.getElementById(id));
  }else{
    phoneSide.insertBefore(clear,document.getElementById('touch-controls')); phoneSide.insertBefore(hikeButton,document.getElementById('auto-design'));
    phoneSide.insertBefore(document.getElementById('mode'),hikeButton); phoneSide.insertBefore(document.getElementById('schemes'),clear); stage.appendChild(document.getElementById('sys'));
  }
}
function updatePhoneControls(pre, off) {
  phoneSide.classList.toggle('live-play', !pre);
  phoneSide.classList.toggle('ready-play', pre);
  document.getElementById('mobile-menu').classList.toggle('def', !off);
  phoneSide.classList.toggle('manual-live', !coachMode && state === 'live');
  phoneSide.classList.toggle('manual-controls', !coachMode);
  if (pre) { touchVector = null; touchLob = false; }
  const running = state === 'live' && ball?.carrier && (off ? ball.carrier.team === 'o' && ball.carrier.name !== 'QB' : ball.carrier.team === 'x');
  document.getElementById('touch-lob').style.display = off && !running ? '' : 'none';
  document.getElementById('touch-pitch').style.display = off ? '' : 'none';
  document.getElementById('touch-switch').style.display = off ? 'none' : '';
  document.getElementById('touch-lob').setAttribute('aria-pressed', String(touchLob));
  document.getElementById('touch-note').textContent = running ? 'Release to keep running' : pre ? (off ? 'AutoPlay design' : 'Tap SET when ready') : off ? 'Aim on field · release to throw' : 'Drag to move · Switch defender';
}
function updateMobileScore() {
  if (!phoneGame || !game) return;
  const overtime = game.drives.you >= 4 && game.drives.pencils >= 4;
  const values = [teamName.slice(0,3).toUpperCase(), game.you, opponentName.slice(0,3).toUpperCase(), game.pencils, state === 'gameover' ? 'FINAL' : overtime ? 'OT' : 'Q' + game.q, state === 'gameover' ? '' : downText(), state === 'gameover' ? 'Game complete' : `${onOffense() ? 'YOUR BALL' : 'DEFENSE'} · ${game.los <= 50 ? 'OWN ' + game.los : 'OPP ' + (100 - game.los)}`];
  document.getElementById('mobile-you').setAttribute('aria-label',teamName); document.getElementById('mobile-opponent').setAttribute('aria-label',opponentName);
  const signature = values.join('|'); if (signature === lastMobileScore) return; lastMobileScore = signature;
  ['mobile-you','mobile-you-score','mobile-opponent','mobile-opponent-score','mobile-quarter','mobile-down','mobile-status'].forEach((id,i) => document.getElementById(id).textContent = values[i]);
}
for (const kind of ['runs','passes']) document.getElementById('tab-' + kind).onclick = () => { phoneSide.classList.toggle('show-passes',kind === 'passes'); for (const k of ['runs','passes']) document.getElementById('tab-' + k).setAttribute('aria-pressed',String(k === kind)); };
function moveThumb(e) { const box = thumbPad.getBoundingClientRect(), dx = e.clientX - box.left - box.width / 2, dy = e.clientY - box.top - box.height / 2, distance = Math.hypot(dx,dy); touchVector = distance < 6 ? {x:0,y:0} : {x:dx/distance,y:dy/distance}; const travel = Math.min(24,distance); thumbKnob.style.transform = `translate(${touchVector.x*travel}px,${touchVector.y*travel}px)`; }
function releaseThumb() { thumbPointer = null; touchVector = {x:0,y:0}; thumbKnob.style.transform = ''; }
thumbPad.addEventListener('pointerdown',e=>{if (state !== 'live' || coachMode || thumbPointer !== null) return; e.preventDefault(); thumbPointer=e.pointerId; thumbPad.setPointerCapture(e.pointerId); moveThumb(e);});
thumbPad.addEventListener('pointermove',e=>{if(e.pointerId===thumbPointer){e.preventDefault();moveThumb(e);}});
for (const event of ['pointerup','pointercancel','lostpointercapture']) thumbPad.addEventListener(event,e=>{if(e.pointerId===thumbPointer)releaseThumb();});
window.addEventListener('blur',releaseThumb);
document.getElementById('touch-lob').onclick=()=>{touchLob=!touchLob;document.getElementById('touch-lob').setAttribute('aria-pressed',String(touchLob));};
document.getElementById('touch-pitch').onclick=()=>{if(state==='live'&&!coachMode&&onOffense()&&canLateral())lateral(null);};
document.getElementById('touch-switch').onclick=()=>{if(state==='live'&&!coachMode&&!onOffense())switchCtrl(null);};
window.addEventListener('resize',()=>{touchVector=null;placeClearButton();if(phoneGame&&state==='presnap'&&onOffense()&&!coachPlayReady())designAutoPlay();if(state==='presnap'){cam.target=Math.max(0,Math.min(FH-fieldViewHeight,yardY(game.los)-(phoneGame?fieldViewHeight*.68:470)));cam.y=cam.target;}else{cam.target=Math.max(0,Math.min(FH-fieldViewHeight,cam.target));cam.y=Math.max(0,Math.min(FH-fieldViewHeight,cam.y));}updateButtons();updateMobileScore();});
if (phoneGame) placeClearButton();
if(MATCH?.season){document.getElementById('back').href='index.html#season';document.getElementById('back').textContent='← season';document.getElementById('newgame').textContent='restart matchup';}
newGame(); tick();
</script>
