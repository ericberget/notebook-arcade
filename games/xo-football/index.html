<script>
const { Engine, World, Bodies, Body } = Matter;
const W = 1200, H = 720;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ink = NotebookInk(ctx); const { INK, RED, GRAPHITE } = ink;
const X_COLOR = '#3a3a40';
const PEN_LT = '#9a9aa0', PEN_MD = '#7a7a82', PEN_DK = '#4a4a50';   // light / medium / bold pencil for the scoreboard column
const DOODLE = '#b4b4ba';                                              // even fainter: marginalia

// ---------- the mascot: a doodled O with arms and legs who lives in the left margin ----------
let teamName = (localStorage.getItem('xo.team') || 'YOU').slice(0, 10);
const NAME_BOX = { x: 76, y: 144, w: 100, h: 36 };   // where the team name sits on the scoreboard (stage coords)
function renameTeam() {

  const inp = document.createElement('input'); inp.id = 'rename'; inp.maxLength = 10; inp.value = teamName === 'YOU' ? '' : teamName; inp.placeholder = 'team name';
  stage.appendChild(inp); inp.focus(); inp.select();
  const done = save => { if (save) { const v = inp.value.trim().slice(0, 10); teamName = v || 'YOU'; localStorage.setItem('xo.team', teamName); SFX.click(); } inp.remove(); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
  inp.addEventListener('blur', () => done(true));
}
let mood = { kind: 'idle', t: 0, len: 0 };
function setMood(kind, len) { mood = { kind, t: len, len }; }
function cheer(n = 240) { setMood('cheer', n); }
function sulk() {}
function drawMascot() {
  if (firstPlayHelp) return;
  const x = 1066, baseY = 590, col = PEN_MD, w = 1.5;
  if (mood.t > 0) mood.t--; else mood.kind = 'idle';
  const k = mood.kind, el = mood.len - mood.t;                       // el: frames elapsed in the current bit
  const flip = k === 'idle' ? 0 : Math.floor(frame / 8) % 3;           // flipbook only while something is happening
  const id = 5000 + flip * 40;
  const PH = { size: 15, color: PEN_MD, font: 'Patrick Hand', weight: 400 };
  const head = (hx, hy, face, rot = 0) => {
    ink.circle(hx, hy, 13, id, col, w + 0.5, 1);
    const P = (px, py) => ({ x: hx + px * Math.cos(rot) - py * Math.sin(rot), y: hy + px * Math.sin(rot) + py * Math.cos(rot) });
    for (const ex of [-5, 5]) { const e = P(ex, -3); if (face === 'dizzy') { ink.line(e.x - 3, e.y - 3, e.x + 3, e.y + 3, id + 20 + ex, col, 1.2, 1); ink.line(e.x + 3, e.y - 3, e.x - 3, e.y + 3, id + 21 + ex, col, 1.2, 1); } else { ctx.fillStyle = PEN_DK; ctx.beginPath(); ctx.arc(e.x, e.y, 1.6, 0, 7); ctx.fill(); } }
    if (face === 'smile') { const m1 = P(-5, 3), m2 = P(0, 8), m3 = P(5, 3); ink.line(m1.x, m1.y, m2.x, m2.y, id + 3, col, 1.3, 1); ink.line(m2.x, m2.y, m3.x, m3.y, id + 4, col, 1.3, 1); }
    else if (face === 'o') ink.circle(P(0, 5).x, P(0, 5).y, 2.5, id + 3, col, 1.2, 1);
    else if (face === 'frown') { const m1 = P(-5, 7), m2 = P(0, 4), m3 = P(5, 7); ink.line(m1.x, m1.y, m2.x, m2.y, id + 3, col, 1.3, 1); ink.line(m2.x, m2.y, m3.x, m3.y, id + 4, col, 1.3, 1); }
    else { const m1 = P(-4, 5), m2 = P(4, 5); ink.line(m1.x, m1.y, m2.x, m2.y + 1, id + 3, col, 1.3, 1); }
  };
  const legs = (hx, hy, spread = 9, stride = 0) => { const l1 = { x: hx - spread + stride, y: hy + 16 }, l2 = { x: hx + spread - stride, y: hy + 16 }; ink.line(hx, hy, l1.x, l1.y, id + 7, col, w, 1); ink.line(hx, hy, l2.x, l2.y, id + 8, col, w, 1); ink.line(l1.x, l1.y, l1.x - 5, l1.y, id + 9, col, w, 1); ink.line(l2.x, l2.y, l2.x + 5, l2.y, id + 10, col, w, 1); };
  const body = (hx, hy) => { ink.line(hx, hy + 13, hx, hy + 36, id + 6, col, w, 1); legs(hx, hy + 36); return { x: hx, y: hy + 19 }; };
  const arms = (sh, a1, a2) => { ink.line(sh.x, sh.y, a1.x, a1.y, id + 11, col, w, 1); ink.line(sh.x, sh.y, a2.x, a2.y, id + 12, col, w, 1); };

  if (k === 'cheer') { // jumping, pennant waving
    const y = baseY - Math.abs(Math.sin(frame * 0.25)) * 14; head(x, y, 'smile'); const sh = body(x, y);
    const a2 = { x: x + 16, y: y - 2 + Math.sin(frame * 0.5) * 3 }; arms(sh, { x: x - 16, y: y + 2 }, a2);
    ink.line(a2.x, a2.y, a2.x + 2, a2.y - 22, id + 13, col, 1.2, 1); const f = Math.sin(frame * 0.4) * 3;
    ink.line(a2.x + 2, a2.y - 22, a2.x + 20, a2.y - 16 + f, id + 14, col, 1.2, 1); ink.line(a2.x + 20, a2.y - 16 + f, a2.x + 2, a2.y - 10, id + 15, col, 1.2, 1);
    ink.text('O', a2.x + 9, a2.y - 13 + f * 0.5, { size: 11, color: col, font: 'Patrick Hand', weight: 400 });
    if (mood.t % 40 < 20) ink.text(mood.t > 100 ? 'YEAH!!' : 'go go go', x + 44, y - 8, { ...PH, rot: -0.1 });
    return;
  }
  if (k === 'worm') { // face down, body rippling, legs kicking behind
    const gy = baseY + 46, ph = frame * 0.16;   // slow, smooth worm
    const pts = []; for (let i = 0; i <= 8; i++) { const t = i / 8; pts.push({ x: x - 34 + t * 52, y: gy - 4 + Math.sin(t * 6 - ph) * 7 }); }
    ink.path(pts, id + 30, col, w + 0.3, 1);
    const h = pts[8]; head(h.x + 12, h.y - 4 + Math.sin(ph) * 3, 'o', 0.9);
    const tail = pts[0]; ink.line(tail.x, tail.y, tail.x - 14, tail.y - 10 - Math.sin(ph) * 6, id + 31, col, w, 1); ink.line(tail.x, tail.y, tail.x - 12, tail.y + 6 + Math.sin(ph) * 5, id + 32, col, w, 1);
    ink.line(pts[5].x, pts[5].y, pts[5].x + 4, pts[5].y - 16, id + 33, col, w, 1);
    if (el < 110 || el % 70 < 40) ink.text(el < 110 ? 'worm time!' : 'oh yeah', x - 20, baseY - 6, { ...PH, size: 17, rot: -0.08 });
    return;
  }
  if (k === 'headpunt') { // pull head off, drop it, punt it out of the margin, wait for it to land back on
    const sh = body(x, baseY); const T = el;
    let hx = x, hy = baseY, face = 'frown', rot = 0, show = true;
    if (T < 40) { hy = baseY - T * 0.9; arms(sh, { x: x - 12, y: hy + 4 }, { x: x + 12, y: hy + 4 }); }
    else if (T < 80) { const u = (T - 40) / 40; hx = x + 18 * u; hy = baseY - 36 + 76 * u * u; rot = u * 3; arms(sh, { x: x - 14, y: sh.y + 12 }, { x: x + 14, y: sh.y + 12 }); }
    else if (T < 96) { hx = x + 18; hy = baseY + 40; face = 'o'; arms(sh, { x: x - 14, y: sh.y - 6 }, { x: x + 14, y: sh.y - 6 }); }
    else if (T < 190) { const u = (T - 96) / 94; hx = x + 18 + u * 160; hy = baseY + 40 - Math.sin(u * Math.PI) * 130 - u * 60; rot = u * 12; face = 'dizzy'; arms(sh, { x: x - 14, y: sh.y - 6 }, { x: x + 14, y: sh.y - 6 }); show = hx < 1195; }
    else if (T < 230) { const u = (T - 190) / 40; hx = x; hy = baseY - 200 + 200 * u * u; face = 'dizzy'; arms(sh, { x: x - 14, y: hy + 10 }, { x: x + 14, y: hy + 10 }); }
    else { arms(sh, { x: x - 14, y: sh.y + 12 }, { x: x + 14, y: sh.y + 12 }); face = 'flat'; }
    if (show) head(hx, hy, face, rot);
    if (T >= 40 && T < 230) ink.line(x, baseY + 8, x, baseY + 13, id + 40, col, w, 1);
    if (T > 80 && T < 96) ink.line(x, baseY + 36, x + 22, baseY + 44, id + 41, col, w, 1);
    if (T >= 96 && T < 130) { ink.line(x, baseY + 36, x + 20, baseY + 20, id + 42, col, w, 1); ink.text('PUNT!', x + 44, baseY - 4, { ...PH, size: 17, rot: -0.15 }); }
    if (T >= 130 && T < 190) ink.text('...', x + 24, baseY - 2, PH);
    if (T >= 230) ink.text('ow', x + 26, baseY - 6, PH);
    return;
  }
  if (k === 'squash') { // pancaked, stars circling, pops back at the end
    const flat = el < 90 ? 1 : Math.max(0, 1 - (el - 90) / 30), gy = baseY + 52;
    ctx.save(); ctx.translate(x, gy); ctx.scale(1 + flat * 0.9, 1 - flat * 0.82); ctx.translate(-x, -gy);
    head(x, baseY, flat > 0.5 ? 'dizzy' : 'flat'); const sh = body(x, baseY); arms(sh, { x: x - 22, y: sh.y + 6 }, { x: x + 22, y: sh.y + 6 });
    ctx.restore();
    if (flat > 0.5) for (let i = 0; i < 3; i++) { const a = frame * 0.12 + i * 2.1; ink.text('*', x + Math.cos(a) * 30, gy - 14 + Math.sin(a) * 6, { ...PH, size: 18 }); }
    if (el < 70) ink.text('splat.', x + 36, gy - 16, PH);
    return;
  }
  if (k === 'facepalm') {
    head(x, baseY, 'frown', 0.15); const sh = body(x, baseY);
    arms(sh, { x: x - 14, y: sh.y + 14 }, { x: x + 4, y: baseY - 2 }); ink.line(x + 4, baseY - 2, x + 10, baseY - 6, id + 50, col, w, 1); ink.line(x + 4, baseY - 2, x + 9, baseY + 3, id + 51, col, w, 1);
    if (el % 60 < 40) ink.text(el < 60 ? 'ugh.' : 'seriously?', x + 30, baseY - 8, PH);
    return;
  }
  head(x, baseY, 'flat'); const sh = body(x, baseY); arms(sh, { x: x - 14, y: baseY + 31 }, { x: x + 14, y: baseY + 29 });
}
const stage = document.getElementById('stage');
function fit() { const rim = window.innerWidth < 700 ? 10 : 40; const s = Math.min((window.innerWidth - rim * 2) / (W + 52), (window.innerHeight - rim * 2) / H); stage.style.transform = `scale(${s})`; stage.style.marginLeft = ((window.innerWidth - (W + 52) * s) / 2 + 52 * s) + 'px'; stage.style.marginTop = ((window.innerHeight - H * s) / 2) + 'px'; }
window.addEventListener('resize', fit); fit();

// hand-drawn title: its baked-in paper background gets keyed out so only the pen strokes sit on our page
const logo = new Image(); logo.src = 'logo.webp'; let logoCut = null;
logo.onload = () => {
  const sx = Math.round(logo.naturalWidth * 0.13), sw = Math.round(logo.naturalWidth * 0.74), sy = Math.round(logo.naturalHeight * 0.24), sh = Math.round(logo.naturalHeight * 0.56);
  const c = document.createElement('canvas'); c.width = sw; c.height = sh; const g = c.getContext('2d'); g.drawImage(logo, sx, sy, sw, sh, 0, 0, sw, sh);
  const im = g.getImageData(0, 0, sw, sh), d = im.data;
  // the background is the most common color: sample it from the corners
  let br = 0, bg = 0, bb = 0; for (const [px, py] of [[2, 2], [sw - 3, 2], [2, sh - 3], [sw - 3, sh - 3]]) { const i = (py * sw + px) * 4; br += d[i] / 4; bg += d[i + 1] / 4; bb += d[i + 2] / 4; }
  for (let i = 0; i < d.length; i += 4) { const dist = Math.hypot(d[i] - br, d[i + 1] - bg, d[i + 2] - bb); d[i + 3] = Math.round(255 * Math.max(0, Math.min(1, (dist - 22) / 45))); }
  g.putImageData(im, 0, 0); logoCut = c;
};
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
const PAPER_STYLE = 'plain';   // unlined: the field draws its own lines
NotebookPaper.draw(paper.getContext('2d'), W, H, PAPER_STYLE);

// ---------- field geometry (north-south: you drive UP the page) ----------
const FX = 280, FW = 640, FH = 1440, YD = 12, GOAL_TOP = 120, GOAL_BOT = 1320, R = 10;
const yardY = n => GOAL_BOT - n * YD;             // n = yards from your own goal line
const yardsOf = y => (GOAL_BOT - y) / YD;
let cam = { y: 0, target: 0 };
// end zones colored in the way you'd do it with a pen: fast back-and-forth strokes, a bit ragged at the edges
function scratchZone(color, seed) {
  const c = document.createElement('canvas'); c.width = FW; c.height = GOAL_TOP; const g = c.getContext('2d');
  let k = seed; const rnd = () => { const x = Math.sin(k++ * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const j = a => (rnd() - 0.5) * a;
  g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round';
  // pass 1: steep diagonal zigzag, the main coloring-in
  g.globalAlpha = 0.28; g.lineWidth = 2.2; g.beginPath();
  for (let x = -30; x < FW + 30; x += 5.5) { g.moveTo(x + j(4), 2 + j(6)); g.lineTo(x + 26 + j(4), GOAL_TOP - 2 + j(6)); }
  g.stroke();
  // pass 2: the other way, sparser, so it reads as scribble not hatch
  g.globalAlpha = 0.2; g.lineWidth = 1.8; g.beginPath();
  for (let x = -30; x < FW + 30; x += 9) { g.moveTo(x + 22 + j(6), 1 + j(6)); g.lineTo(x + j(6), GOAL_TOP - 1 + j(6)); }
  g.stroke();
  // pass 3: a few long loose scribbles wandering across, where the pen pressed harder
  for (let n = 0; n < 9; n++) {
    g.globalAlpha = 0.16 + rnd() * 0.14; g.lineWidth = 1.6 + rnd() * 1.6; g.beginPath();
    let x = rnd() * FW, y = rnd() * GOAL_TOP; g.moveTo(x, y);
    for (let i = 0; i < 40; i++) { x += j(70); y = (i % 2 ? 6 : GOAL_TOP - 6) + j(14); x = Math.max(-10, Math.min(FW + 10, x)); g.lineTo(x, y); }
    g.stroke();
  }
  // pass 4: dark corners and a blotch or two, like the pen sat there
  for (let n = 0; n < 5; n++) { const bx = rnd() * FW, by = rnd() * GOAL_TOP; g.globalAlpha = 0.25; g.lineWidth = 2; g.beginPath(); for (let i = 0; i < 18; i++) { g.lineTo(bx + j(26), by + j(18)); } g.stroke(); }
  g.globalAlpha = 1; return c;
}
const zoneTop = scratchZone('#c0392b', 7), zoneBot = scratchZone('#1f3d9e', 31);
const toScreen = (x, y) => ({ x: FX + x, y: y - cam.y });
const toField = (sx, sy) => ({ x: sx - FX, y: sy + cam.y });

// ---------- sound ----------
const SFX = (() => {
  let ac, master, noiseBuf, muted = false, crowd, crowdGain, scratchGain;
  function init() { if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    crowd = ac.createBufferSource(); crowd.buffer = noiseBuf; crowd.loop = true; const cf = ac.createBiquadFilter(); cf.type = 'lowpass'; cf.frequency.value = 500; crowdGain = ac.createGain(); crowdGain.gain.value = 0.03; crowd.connect(cf).connect(crowdGain).connect(master); crowd.start();
    const sc = ac.createBufferSource(); sc.buffer = noiseBuf; sc.loop = true; const sf = ac.createBiquadFilter(); sf.type = 'bandpass'; sf.frequency.value = 3200; sf.Q.value = 1.2; scratchGain = ac.createGain(); scratchGain.gain.value = 0; sc.connect(sf).connect(scratchGain).connect(master); sc.start(); }
  const now = () => ac.currentTime;

      let best = null, bd = 1e9; for (const p of players) { if (p.team === 'x' && p.stumble > 0) continue; const d = Math.hypot(p.body.position.x - loose.x, p.body.position.y - loose.y); if (d < bd) { bd = d; best = p; } }
      if (best && bd < 16) recoverLoose(best);
      else if (loose.t > 300) { endPlay('tackle', 'dead ball', loose); loose = null; }
    }
    else if (ball.carrier) {
      const c = ball.carrier, pos = c.body.position;
      if (c.team === 'x' && pos.y >= GOAL_BOT - 2) endPlay('pick6', 'PICK SIX', pos);
      else if (c.team === 'x' && (pos.x < 2 || pos.x > FW - 2)) endPlay('int', intText(), pos);
      else if (c.team === 'o' && pos.y <= GOAL_TOP + 2) { endPlay('td', null, pos); }
      else if (pos.x < 2 || pos.x > FW - 2) endPlay('oob', 'out of bounds', pos);
      else checkContact();
    }
    if (state === 'live' && playFrame > 900) endPlay('inc', 'play blown dead', ball.carrier ? ball.carrier.body.position : { x: FW / 2, y: yardY(game.los) });
    const fy = ball.flying ? ball.flying.from.y + (ball.flying.to.y - ball.flying.from.y) * ball.flying.t / ball.flying.T : loose ? loose.y : ball.carrier ? ball.carrier.body.position.y : cam.target + 400;
    cam.target = Math.max(0, Math.min(FH - H, fy - 400));
  } else if (state === 'result') {
    Engine.update(engine, 1000 / 60); for (const p of players) Body.setVelocity(p.body, { x: p.body.velocity.x * 0.85, y: p.body.velocity.y * 0.85 });
    if (++resultTimer > (result.kind === 'td' ? 130 : 75)) afterResult();
  } else if (state === 'fg') {
    fgAnim.t++; cam.target = Math.max(0, Math.min(FH - H, yardY(game.los) - 560));
    if (fgAnim.t === fgAnim.T) { const mine = onOffense(); if (fgAnim.good) { game[mine ? 'you' : 'pencils'] += 3; note(`${mine ? '' : 'pencils '}${fgAnim.dist} yd field goal is GOOD. +3`, mine ? INK : RED); if (mine) SFX.good(); else { SFX.bad(); setMood('facepalm', 120); } } else { note(`${mine ? '' : 'pencils '}${fgAnim.dist} yd field goal: no good.`, mine ? RED : INK); if (mine) { SFX.bad(); setMood('facepalm', 150); } else { SFX.good(); cheer(120); } } }
    if (fgAnim.t > fgAnim.T + 70) endPossession(fgAnim.good ? 'fg' : 'kickmiss');
  }
  cam.y += (cam.target - cam.y) * (state === 'presnap' ? 1 : 0.1);
}
// fixed 60 Hz simulation regardless of how often the browser paints
let lastT = 0, acc = 0;
function tick(now = performance.now()) {
  frame++;   // (no ink.tick(): the sketch lines hold still in this game)
  if (!lastT) lastT = now; acc += Math.min(200, now - lastT); lastT = now;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }

  ctx.drawImage(paper, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(FX - 30, 0, FW + 60, H); ctx.clip();
  drawField(); drawRoutes(); drawPlayers(); drawAimFinger();
  ctx.restore();
  if (introT >= 150) drawMascot();
  drawScoreboard(); drawResult();
  requestAnimationFrame(tick);
}
newGame(); tick();
</script>
