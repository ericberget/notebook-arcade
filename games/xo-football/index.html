<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #e9e4d6; overflow: hidden; font-family: 'Patrick Hand', cursive; }

  canvas { display: block; box-shadow: 0 10px 30px rgba(0,0,0,.25); cursor: crosshair; touch-action: none; }
  #top { position: absolute; left: 74px; top: 14px; }
  #sys { position: absolute; left: 74px; top: 600px; display: flex; flex-direction: column; gap: 9px; align-items: flex-start; }
  #sys button, #top #back { color: #7a7a82; border-color: #9a9aa0; }
  #rename { position: absolute; left: 84px; top: 147px; width: 96px; font-family: 'Patrick Hand', cursive; font-size: 22px; color: #4a4a50; background: #fbf8ee; border: none; border-bottom: 2px solid #9a9aa0; outline: none; padding: 0 2px; }
  #sys button:hover { background: rgba(80,80,90,.07); }
  button, #back { font-family: 'Patrick Hand', cursive; font-size: 18px; background: transparent; border: 2px solid #1f3d9e; color: #1f3d9e; padding: 3px 12px; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; cursor: pointer; transform: rotate(1deg); }
  button:hover { background: rgba(31,61,158,.08); }

  #back { border: none; border-bottom: 2px solid #1f3d9e; border-radius: 0; text-decoration: none; padding: 6px 10px; transform: rotate(-1.5deg); }

  #stage.intro #side, #stage.intro #sys, #stage.intro #top { opacity: 0; }
  #side .label { font-size: 16px; color: #4a4a4f; opacity: .65; margin-top: 4px; transform: rotate(-.5deg); line-height: 1.2; }
  #hike { font-family: 'Caveat', cursive; font-size: 40px; color: #c0392b; border-color: #c0392b; border-width: 3px; padding: 2px 10px; transform: rotate(-2deg); }
  #hike:hover { background: rgba(192,57,43,.1); }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; }
  .presets button { font-size: 14px; padding: 0 7px; }

<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1200" height="720"></canvas>
  <div id="top"><a href="../../index.html" id="back">← arcade</a></div>
  <div id="sys"><button id="mute">sound: on</button><button id="newgame">new game</button></div>
  <div id="side">
    <button id="hike">HIKE!</button>
    <div id="fourth"><button id="fg">kick field goal</button><button id="punt">punt</button></div>
    <div class="label">run plays</div>
    <div id="runs" class="presets"></div>
    <div class="label">pass plays</div>

    <div class="label" id="hint">drag from any O to draw its route</div>
  </div>
</div></div>

<script>
const { Engine, World, Bodies, Body } = Matter;
const W = 1200, H = 720;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ink = NotebookInk(ctx); const { INK, RED, GRAPHITE } = ink;
const X_COLOR = '#3a3a40';
const PEN_LT = '#9a9aa0', PEN_MD = '#7a7a82', PEN_DK = '#4a4a50';   // light / medium / bold pencil for the scoreboard column
const DOODLE = '#b4b4ba';                                              // even fainter: marginalia

// ---------- the mascot: a doodled O with arms and legs who lives in the left margin ----------
let teamName = (localStorage.getItem('xo.team') || 'YOU').slice(0, 10);
const NAME_BOX = { x: 76, y: 144, w: 100, h: 36 };   // where the team name sits on the scoreboard (stage coords)
function renameTeam() {
  if (document.getElementById('rename')) return;
  const inp = document.createElement('input'); inp.id = 'rename'; inp.maxLength = 10; inp.value = teamName === 'YOU' ? '' : teamName; inp.placeholder = 'team name';
  stage.appendChild(inp); inp.focus(); inp.select();
  const done = save => { if (save) { const v = inp.value.trim().slice(0, 10); teamName = v || 'YOU'; localStorage.setItem('xo.team', teamName); SFX.click(); } inp.remove(); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
  inp.addEventListener('blur', () => done(true));
}
let mood = { kind: 'idle', t: 0 };
function cheer(n = 150) { mood = { kind: 'cheer', t: n }; }
function sulk() {}   // he keeps his composure; only touchdowns move him
function drawMascot() {
  const x = 1066, baseY = 500; const cheering = mood.kind === 'cheer';
  const flip = cheering ? Math.floor(frame / 10) % 3 : 0;               // flipbook only while celebrating; otherwise one fixed drawing
  const id = 5000 + flip * 40; const col = PEN_MD, w = 1.5;
  if (mood.t > 0) mood.t--; else mood.kind = 'idle';
  const k = mood.kind;
  const bob = k === 'cheer' ? Math.abs(Math.sin(frame * 0.25)) * 14 : 0;
  const y = baseY - bob, tilt = 0;
  const P = (px, py) => ({ x: x + px * Math.cos(tilt) - py * Math.sin(tilt), y: y + px * Math.sin(tilt) + py * Math.cos(tilt) });
  // head (an O, of course)
  const h = P(0, 0); ink.circle(h.x, h.y, 13, id, col, w + 0.5, 1);
  const blink = false;
  for (const ex of [-5, 5]) { const e = P(ex, -3); if (blink) ink.line(e.x - 2, e.y, e.x + 2, e.y, id + 2, col, 1.2, 1); else { ctx.fillStyle = PEN_DK; ctx.beginPath(); ctx.arc(e.x, e.y, 1.6, 0, 7); ctx.fill(); } }
  if (k === 'cheer') { const m1 = P(-5, 3), m2 = P(0, 8), m3 = P(5, 3); ink.line(m1.x, m1.y, m2.x, m2.y, id + 3, col, 1.3, 1); ink.line(m2.x, m2.y, m3.x, m3.y, id + 4, col, 1.3, 1); }
  else if (k === 'sad') { const m1 = P(-5, 7), m2 = P(0, 4), m3 = P(5, 7); ink.line(m1.x, m1.y, m2.x, m2.y, id + 3, col, 1.3, 1); ink.line(m2.x, m2.y, m3.x, m3.y, id + 4, col, 1.3, 1); const d = P(15, -2); ink.line(d.x, d.y, d.x + 1, d.y + 6 + (frame % 30) * 0.3, id + 5, PEN_LT, 1.5, 1); }
  else { const m1 = P(-4, 5), m2 = P(4, 5); ink.line(m1.x, m1.y, m2.x, m2.y + 1, id + 3, col, 1.3, 1); }
  // body and legs
  const n = P(0, 13), hip = P(0, 36); ink.line(n.x, n.y, hip.x, hip.y, id + 6, col, w, 1);
  const stride = k === 'cheer' ? Math.sin(frame * 0.25) * 8 : 0;
  const l1 = P(-9 + stride, 52), l2 = P(9 - stride, 52); ink.line(hip.x, hip.y, l1.x, l1.y, id + 7, col, w, 1); ink.line(hip.x, hip.y, l2.x, l2.y, id + 8, col, w, 1);
  ink.line(l1.x, l1.y, l1.x - 5, l1.y, id + 9, col, w, 1); ink.line(l2.x, l2.y, l2.x + 5, l2.y, id + 10, col, w, 1);
  // arms
  const sh = P(0, 19);
  if (k === 'cheer') {
    const a1 = P(-16, 2), a2 = P(16, -2 + Math.sin(frame * 0.5) * 3); ink.line(sh.x, sh.y, a1.x, a1.y, id + 11, col, w, 1); ink.line(sh.x, sh.y, a2.x, a2.y, id + 12, col, w, 1);
    // a little pennant in the raised hand
    ink.line(a2.x, a2.y, a2.x + 2, a2.y - 22, id + 13, col, 1.2, 1); const f = Math.sin(frame * 0.4) * 3;
    ink.line(a2.x + 2, a2.y - 22, a2.x + 20, a2.y - 16 + f, id + 14, col, 1.2, 1); ink.line(a2.x + 20, a2.y - 16 + f, a2.x + 2, a2.y - 10, id + 15, col, 1.2, 1);
    ink.text('O', a2.x + 9, a2.y - 13 + f * 0.5, { size: 11, color: col, font: 'Patrick Hand', weight: 400 });
  } else if (k === 'sad') {
    const a1 = P(-9, 34), a2 = P(9, 35); ink.line(sh.x, sh.y, a1.x, a1.y, id + 11, col, w, 1); ink.line(sh.x, sh.y, a2.x, a2.y, id + 12, col, w, 1);
  } else {
    const a1 = P(-14, 31), a2 = P(14, 29); ink.line(sh.x, sh.y, a1.x, a1.y, id + 11, col, w, 1); ink.line(sh.x, sh.y, a2.x, a2.y, id + 12, col, w, 1);
  }
  if (k === 'cheer' && mood.t % 40 < 20) ink.text(mood.t > 100 ? 'YEAH!!' : 'go go go', x + 44, y - 8, { size: 16, color: PEN_MD, font: 'Patrick Hand', weight: 400, rot: -0.1 });
  if (k === 'sad' && mood.t > 60) ink.text('...oof', x + 40, y + 2, { size: 15, color: PEN_LT, font: 'Patrick Hand', weight: 400, rot: 0.05 });
}
const stage = document.getElementById('stage');
function fit() { const s = Math.min(window.innerWidth / W, window.innerHeight / H); stage.style.transform = `scale(${s})`; stage.style.marginLeft = ((window.innerWidth - W * s) / 2) + 'px'; stage.style.marginTop = ((window.innerHeight - H * s) / 2) + 'px'; }
window.addEventListener('resize', fit); fit();

const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
const PAPER_STYLE = 'sketchpad';   // unlined: the field draws its own lines
NotebookPaper.draw(paper.getContext('2d'), W, H, PAPER_STYLE);

// ---------- field geometry (north-south: you drive UP the page) ----------
const FX = 280, FW = 640, FH = 1440, YD = 12, GOAL_TOP = 120, GOAL_BOT = 1320, R = 10;
const yardY = n => GOAL_BOT - n * YD;             // n = yards from your own goal line
const yardsOf = y => (GOAL_BOT - y) / YD;
let cam = { y: 0, target: 0 };
// end zones colored in the way you'd do it with a pen: fast back-and-forth strokes, a bit ragged at the edges
function scratchZone(color, seed) {
  const c = document.createElement('canvas'); c.width = FW; c.height = GOAL_TOP; const g = c.getContext('2d');
  let k = seed; const rnd = () => { const x = Math.sin(k++ * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const j = a => (rnd() - 0.5) * a;
  g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round';
  // pass 1: steep diagonal zigzag, the main coloring-in
  g.globalAlpha = 0.28; g.lineWidth = 2.2; g.beginPath();
  for (let x = -30; x < FW + 30; x += 5.5) { g.moveTo(x + j(4), 2 + j(6)); g.lineTo(x + 26 + j(4), GOAL_TOP - 2 + j(6)); }
  g.stroke();
  // pass 2: the other way, sparser, so it reads as scribble not hatch
  g.globalAlpha = 0.2; g.lineWidth = 1.8; g.beginPath();
  for (let x = -30; x < FW + 30; x += 9) { g.moveTo(x + 22 + j(6), 1 + j(6)); g.lineTo(x + j(6), GOAL_TOP - 1 + j(6)); }
  g.stroke();
  // pass 3: a few long loose scribbles wandering across, where the pen pressed harder
  for (let n = 0; n < 9; n++) {
    g.globalAlpha = 0.16 + rnd() * 0.14; g.lineWidth = 1.6 + rnd() * 1.6; g.beginPath();
    let x = rnd() * FW, y = rnd() * GOAL_TOP; g.moveTo(x, y);
    for (let i = 0; i < 40; i++) { x += j(70); y = (i % 2 ? 6 : GOAL_TOP - 6) + j(14); x = Math.max(-10, Math.min(FW + 10, x)); g.lineTo(x, y); }
    g.stroke();
  }
  // pass 4: dark corners and a blotch or two, like the pen sat there
  for (let n = 0; n < 5; n++) { const bx = rnd() * FW, by = rnd() * GOAL_TOP; g.globalAlpha = 0.25; g.lineWidth = 2; g.beginPath(); for (let i = 0; i < 18; i++) { g.lineTo(bx + j(26), by + j(18)); } g.stroke(); }
  g.globalAlpha = 1; return c;
}
const zoneTop = scratchZone('#c0392b', 7), zoneBot = scratchZone('#1f3d9e', 31);
const toScreen = (x, y) => ({ x: FX + x, y: y - cam.y });
const toField = (sx, sy) => ({ x: sx - FX, y: sy + cam.y });

// ---------- sound ----------
const SFX = (() => {
  let ac, master, noiseBuf, muted = false, crowd, crowdGain, scratchGain;
  function init() { if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    crowd = ac.createBufferSource(); crowd.buffer = noiseBuf; crowd.loop = true; const cf = ac.createBiquadFilter(); cf.type = 'lowpass'; cf.frequency.value = 500; crowdGain = ac.createGain(); crowdGain.gain.value = 0.03; crowd.connect(cf).connect(crowdGain).connect(master); crowd.start();
    const sc = ac.createBufferSource(); sc.buffer = noiseBuf; sc.loop = true; const sf = ac.createBiquadFilter(); sf.type = 'bandpass'; sf.frequency.value = 3200; sf.Q.value = 1.2; scratchGain = ac.createGain(); scratchGain.gain.value = 0; sc.connect(sf).connect(scratchGain).connect(master); sc.start(); }
  const now = () => ac.currentTime;
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(type, f0, f1, dur, vol, t = now(), lp) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = ac.createGain(); env(g, t, 0.005, vol, dur); let n = o; if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; } n.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05); }
  function noise(dur, vol, t = now(), o = {}) { const n = ac.createBufferSource(); n.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1; f.frequency.setValueAtTime(o.f0 || 1000, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur); const g = ac.createGain(); env(g, t, o.attack || 0.003, vol, dur); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.05); }
  return {
    resume() { init(); if (ac.state === 'suspended') ac.resume(); },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7; return muted; },
    crowd(level) { if (!ac) return; crowdGain.gain.setTargetAtTime(0.03 + level * 0.12, now(), 0.3); },
    scratch(on) { if (!ac) return; scratchGain.gain.setTargetAtTime(on && !muted ? 0.05 : 0, now(), 0.03); },
    hut() { if (!ac || muted) return; const t = now(); tone('sawtooth', 180, 120, 0.12, 0.25, t, 900); noise(0.08, 0.3, t + 0.02, { f0: 1200, q: 2 }); noise(0.05, 0.4, t + 0.1, { type: 'highpass', f0: 3000 }); },
    whistle() { if (!ac || muted) return; const t = now(); tone('sine', 2200, 2500, 0.18, 0.22, t); tone('sine', 2500, 2450, 0.25, 0.18, t + 0.18); },
    throw_(p = 1) { if (!ac || muted) return; noise(0.18 + (1 - p) * 0.25, 0.12 + p * 0.15, now(), { f0: 500, f1: 1200 + p * 1800, q: 1, attack: 0.04 }); },
    catch_() { if (!ac || muted) return; const t = now(); tone('sine', 700, 250, 0.08, 0.35, t); noise(0.06, 0.3, t, { f0: 1800, q: 1.5 }); },
    thump(v = 1) { if (!ac || muted) return; const t = now(); tone('sine', 150, 45, 0.18, 0.4 * v, t); noise(0.1, 0.35 * v, t, { f0: 500, f1: 150, q: 1 }); noise(0.04, 0.25 * v, t, { type: 'highpass', f0: 2500 }); },
    td() { if (!ac || muted) return; const t = now(); [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.35, 0.22, t + i * 0.1)); tone('triangle', 1047, 1047, 1.0, 0.2, t + 0.45); tone('triangle', 1319, 1319, 1.0, 0.15, t + 0.45); this.crowd(1); setTimeout(() => this.crowd(0), 2500); },
    bad() { if (!ac || muted) return; const t = now(); tone('sawtooth', 220, 180, 0.35, 0.16, t, 700); tone('sawtooth', 165, 140, 0.5, 0.16, t + 0.3, 600); },
    good() { if (!ac || muted) return; const t = now(); tone('square', 880, 880, 0.12, 0.08, t, 2500); tone('square', 1175, 1175, 0.3, 0.08, t + 0.12, 2500); },
    kick() { if (!ac || muted) return; const t = now(); tone('sine', 120, 60, 0.12, 0.4, t); noise(0.2, 0.25, t, { f0: 400, f1: 1800, q: 1, attack: 0.02 }); },
    click() { if (!ac || muted) return; noise(0.03, 0.2, now(), { f0: 2500, q: 5 }); },
    pencil() { if (!ac || muted) return; const t = now(); for (let i = 0; i < 4; i++) noise(0.12, 0.08, t + i * 0.13, { f0: 2500 + Math.random() * 1500, q: 1.5, attack: 0.03 }); },
    win() { if (!ac || muted) return; const t = now(); [[262, 330, 392], [294, 370, 440], [330, 415, 494], [392, 494, 587, 784]].forEach((ch, i) => ch.forEach(f => tone('triangle', f, f, 0.5, 0.14, t + i * 0.25))); },
  };
})();

// ---------- game state ----------
let engine, world, players = [], ball, state = 'presnap', frame = 0, playFrame = 0, mouse = { x: 320, y: 1000, down: false };
let game, drawing = null, result = null, log = [], resultTimer = 0, fgAnim = null, gameOverText = null;
// sketch-in intro: introT counts steps since new game; rv(start, dur) = how far along (0..1) a given element's stroke is
let introT = 9999; const INTRO_LEN = 170;
const rv = (start, dur) => Math.max(0, Math.min(1, (introT - start) / dur));
function startIntro() { introT = 0; stage.classList.add('intro'); SFX.scratch(true); }
const hintEl = document.getElementById('hint');

const SPEED = { QB: 2.75, RB: 3.35, WR: 3.45, TE: 3.05, OL: 2.5, DE: 2.75, NT: 2.6, LB: 2.95, CB: 3.15, S: 3.2 };
const OFFENSE = [ // [name, kind, dx, dy] relative to the ball at the line of scrimmage (dy + is back toward you)
  ['QB', 'QB', 0, 60], ['C', 'OL', 0, 4], ['LG', 'OL', -26, 4], ['RG', 'OL', 26, 4],
  ['RB', 'RB', 0, 104], ['WR-L', 'WR', -235, 6], ['WR-R', 'WR', 235, 6], ['TE', 'TE', 54, 6],
];
const DEFENSE = [
  ['DE-L', 'DE', -28, -16, 'rush', 'LG'], ['NT', 'NT', 0, -16, 'rush', 'C'], ['DE-R', 'DE', 28, -16, 'rush', 'RG'],
  ['LB-L', 'LB', -46, -64, 'man', 'RB'], ['LB-R', 'LB', 60, -60, 'man', 'TE'],
  ['CB-L', 'CB', -235, -78, 'man', 'WR-L'], ['CB-R', 'CB', 235, -78, 'man', 'WR-R'], ['S', 'S', 0, -170, 'zone', null],
];
// quick plays: waypoints in px relative to each player's spot (negative y = upfield). a route through the QB = handoff.
const RUNS = {
  'HB dive': { 'RB': [[0, -44], [8, -160], [8, -400]] },
  'sweep left': { 'RB': [[-8, -40], [-150, -70], [-200, -200], [-200, -500]], 'WR-L': [[0, -80], [-30, -200]], 'TE': [[-40, -30], [-120, -50]] },
  'sweep right': { 'RB': [[8, -40], [150, -70], [200, -200], [200, -500]], 'WR-R': [[0, -80], [30, -200]], 'TE': [[40, -30], [120, -50]] },
  'counter': { 'RB': [[34, -8], [0, -44], [-70, -80], [-90, -180], [-90, -450]], 'TE': [[-60, -30], [-150, -50]], 'WR-L': [[0, -90], [-20, -220]] },
  'QB sneak': { 'QB': [[0, -70], [0, -300]], 'WR-L': [[0, -120]], 'WR-R': [[0, -120]] },
  'bootleg': { 'QB': [[70, 14], [150, -30], [200, -160], [200, -450]], 'TE': [[40, -30], [140, -60]], 'WR-R': [[0, -200]], 'RB': [[-40, -20], [-110, -40]] },
};
const PASSES = {
  'four verts': { 'WR-L': [[0, -320]], 'WR-R': [[0, -320]], 'TE': [[16, -280]], 'RB': [[-130, -30], [-170, -90]] },
  'slants': { 'WR-L': [[0, -46], [110, -120]], 'WR-R': [[0, -46], [-110, -120]], 'TE': [[0, -34], [90, -60]], 'RB': [[120, -14], [170, -60]] },
  'curls': { 'WR-L': [[0, -130], [10, -100]], 'WR-R': [[0, -130], [-10, -100]], 'TE': [[0, -90], [-8, -66]], 'RB': [[-120, -10], [-160, -40]] },
  'crossers': { 'WR-L': [[0, -70], [320, -90]], 'WR-R': [[0, -120], [-320, -140]], 'TE': [[0, -200]], 'RB': [[100, -10], [160, -50]] },
  'play action': { 'WR-L': [[0, -160], [90, -280]], 'WR-R': [[0, -340]], 'TE': [[-90, -30], [-220, -44]], 'RB': [[0, -30], [50, -60]] },
  'HB screen': { 'RB': [[-70, 8], [-190, -30], [-200, -160], [-200, -400]], 'WR-L': [[0, -70]], 'WR-R': [[0, -70]], 'TE': [[0, -50]] },
};
const PRESETS = { ...RUNS, ...PASSES };

function newGame() {
  startIntro();
  game = { q: 1, you: 0, pencils: 0, los: 25, down: 1, fd: 35, possessions: 0 };
  log = []; gameOverText = null; note('kickoff! your ball on the 25', INK);

    ctx.globalAlpha = 1; const s = toScreen(to.x, to.y); ink.circle(s.x, s.y, 12, 903, INK, 1.5, 1); ink.line(s.x - 5, s.y, s.x + 5, s.y, 904, INK, 1.2, 1); ink.line(s.x, s.y - 5, s.x, s.y + 5, 905, INK, 1.2, 1);
    ink.text(lob ? 'lob' : pp.sp > 10 ? 'bomb' : pp.sp < 7.8 ? 'touch' : 'bullet', s.x + 24, s.y + 6, { size: 18, color: GRAPHITE, font: 'Patrick Hand', weight: 400, alpha: 0.75, align: 'left' });
    const r = receiverFor(to); if (r) { const rs = toScreen(r.body.position.x, r.body.position.y); ink.circle(rs.x, rs.y, R + 6, 906, INK, 1.2, 1); }
    return;
  }
  if (ball.carrier.name === 'QB' && !ball.carrier.scramble) return;
  const s = toScreen(mouse.x, mouse.y); ink.circle(s.x, s.y, 6, 900, GRAPHITE, 1, 1); ink.line(s.x - 10, s.y, s.x + 10, s.y, 901, GRAPHITE, 1, 1); ink.line(s.x, s.y - 10, s.x, s.y + 10, 902, GRAPHITE, 1, 1);
}

// ---------- loop ----------
function step() {
  if (introT < INTRO_LEN) { introT++; if (introT >= 120 && stage.classList.contains('intro')) stage.classList.remove('intro'); if (introT >= INTRO_LEN) SFX.scratch(false); }
  if (state === 'live') {
    playFrame++;
    updateOffense(); updateDefense();
    Engine.update(engine, 1000 / 60);
    if (ball.flying) { ball.flying.t++; if (ball.flying.t >= ball.flying.T) landBall(); }
    else if (loose) {
      loose.t++;
      let best = null, bd = 1e9; for (const p of players) { if (p.team === 'x' && p.stumble > 0) continue; const d = Math.hypot(p.body.position.x - loose.x, p.body.position.y - loose.y); if (d < bd) { bd = d; best = p; } }
      if (best && bd < 16) recoverLoose(best);
      else if (loose.t > 300) { endPlay('tackle', 'dead ball', loose); loose = null; }
    }
    else if (ball.carrier) {
      const c = ball.carrier, pos = c.body.position;
      if (c.team === 'x' && pos.y >= GOAL_BOT - 2) endPlay('pick6', 'PICK SIX', pos);
      else if (c.team === 'x' && (pos.x < 2 || pos.x > FW - 2)) endPlay('int', 'INTERCEPTED by the pencils!', pos);
      else if (c.team === 'o' && pos.y <= GOAL_TOP + 2) { endPlay('td', null, pos); }
      else if (pos.x < 2 || pos.x > FW - 2) endPlay('oob', 'out of bounds', pos);
      else checkContact();
    }
    if (state === 'live' && playFrame > 900) endPlay('inc', 'play blown dead', ball.carrier ? ball.carrier.body.position : { x: FW / 2, y: yardY(game.los) });
    const fy = ball.flying ? ball.flying.from.y + (ball.flying.to.y - ball.flying.from.y) * ball.flying.t / ball.flying.T : loose ? loose.y : ball.carrier ? ball.carrier.body.position.y : cam.target + 400;
    cam.target = Math.max(0, Math.min(FH - H, fy - 400));
  } else if (state === 'result') {
    Engine.update(engine, 1000 / 60); for (const p of players) Body.setVelocity(p.body, { x: p.body.velocity.x * 0.85, y: p.body.velocity.y * 0.85 });
    if (++resultTimer > (result.kind === 'td' ? 130 : 75)) afterResult();
  } else if (state === 'fg') {
    fgAnim.t++; cam.target = Math.max(0, Math.min(FH - H, yardY(game.los) - 560));
    if (fgAnim.t === fgAnim.T) { if (fgAnim.good) { game.you += 3; SFX.good(); note(`${fgAnim.dist} yd field goal is GOOD. +3`, INK); } else { SFX.bad(); note(`${fgAnim.dist} yd field goal: no good.`, RED); } }
    if (fgAnim.t > fgAnim.T + 70) endPossession('kick');
  }
  cam.y += (cam.target - cam.y) * (state === 'presnap' ? 1 : 0.1);
}
// fixed 60 Hz simulation regardless of how often the browser paints
let lastT = 0, acc = 0;
function tick(now = performance.now()) {
  frame++;   // (no ink.tick(): the sketch lines hold still in this game)
  if (!lastT) lastT = now; acc += Math.min(200, now - lastT); lastT = now;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }

  ctx.drawImage(paper, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(FX - 30, 0, FW + 60, H); ctx.clip();
  drawField(); drawRoutes(); drawPlayers(); drawAimFinger();
  ctx.restore();
  if (introT >= 150) drawMascot();
  drawScoreboard(); drawResult();
  requestAnimationFrame(tick);
}
newGame(); tick();
</script>
