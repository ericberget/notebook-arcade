<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Notebook Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #d9d2c0; overflow: hidden; font-family: 'Patrick Hand', cursive; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #stage { position: relative; width: 1200px; height: 720px; transform-origin: top left; }
  canvas { display: block; box-shadow: 0 14px 40px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="1200" height="720"></canvas></div></div>
<script src="shared/paper.js"></script>
<script src="shared/ink.js"></script>
<script>
const W = 1200, H = 720;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ink = NotebookInk(ctx); const { INK, RED, GRAPHITE } = ink;
const PEN_LT = '#9a9aa0', PEN_MD = '#7a7a82', PEN_DK = '#4a4a50', BROWN = '#8a5a2b', GREEN = '#6f9a5a', HILITE = 'rgba(255,230,80,.45)';
const stage = document.getElementById('stage');
function fit() { const s = Math.min(window.innerWidth / W, window.innerHeight / H); stage.style.transform = `scale(${s})`; stage.style.marginLeft = ((window.innerWidth - W * s) / 2) + 'px'; stage.style.marginTop = ((window.innerHeight - H * s) / 2) + 'px'; }
window.addEventListener('resize', fit); fit();

// the real wordmark, keyed onto the paper; drawn lettering if it hasn't loaded
let logoCut = null; { const im = new Image(); im.onload = () => { logoCut = keyOut(im); }; im.src = 'assets/notebook-arcade-wordmark-v2.webp'; }
function keyOut(img) { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; const g = c.getContext('2d'); g.drawImage(img, 0, 0); const im = g.getImageData(0, 0, c.width, c.height), d = im.data; let br = 0, bg = 0, bb = 0; for (const [px, py] of [[2, 2], [c.width - 3, 2], [2, c.height - 3], [c.width - 3, c.height - 3]]) { const i = (py * c.width + px) * 4; br += d[i] / 4; bg += d[i + 1] / 4; bb += d[i + 2] / 4; } for (let i = 0; i < d.length; i += 4) { const dist = Math.hypot(d[i] - br, d[i + 1] - bg, d[i + 2] - bb); d[i + 3] = Math.round(255 * Math.max(0, Math.min(1, (dist - 22) / 45))); } g.putImageData(im, 0, 0); return c; }

// ---------- sound ----------
const SFX = (() => {
  let ac, noiseBuf, master;
  function init() { if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination); noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  function noise(dur, vol, t, o = {}) { const n = ac.createBufferSource(); n.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1; f.frequency.setValueAtTime(o.f0 || 1000, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur); const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.05); }
  return {
    flip() { try { init(); if (ac.state === 'suspended') ac.resume(); const t = ac.currentTime; noise(0.32, 0.3, t, { f0: 600, f1: 4500, q: 0.6, attack: 0.08 }); noise(0.18, 0.35, t + 0.22, { f0: 3500, f1: 500, q: 0.9 }); } catch (e) {} },
    tick() { try { init(); if (ac.state === 'suspended') ac.resume(); noise(0.03, 0.15, ac.currentTime, { f0: 2500, q: 5 }); } catch (e) {} },
    scratch() { try { init(); const t = ac.currentTime; for (let i = 0; i < 10; i++) noise(0.14, 0.045, t + i * 0.15, { f0: 2600 + Math.random() * 1400, q: 1.5, attack: 0.03 }); } catch (e) {} },
  };
})();

// ---------- the doodled page ----------
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
function buildPaper() {
  const g = paper.getContext('2d'); NotebookPaper.draw(g, W, H, 'ruled');
  // a torn-out page: ragged left edge where it came off the spiral, with the little fringe bits
  g.fillStyle = '#d9d2c0'; g.beginPath(); g.moveTo(0, 0);
  for (let y = 0; y <= H; y += 9) g.lineTo(16 + Math.random() * 14 + Math.sin(y * 0.05) * 5 + ((y / 36) % 2 < 1 ? 6 : 0), y);
  g.lineTo(0, H); g.closePath(); g.fill(); g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 1.2; g.stroke();
  for (let y = 30; y < H; y += 36) { g.fillStyle = '#d9d2c0'; g.beginPath(); g.arc(44, y, 7, 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = 1; g.stroke(); }
  // coffee ring, a grease thumbprint, a smear where a hand dragged across wet ink
  const ring = (x, y, r) => { for (let k = 0; k < 3; k++) { g.strokeStyle = `rgba(110,70,30,${0.09 + k * 0.05})`; g.lineWidth = 6 - k * 1.5; g.beginPath(); for (let i = 0; i <= 44; i++) { const t = i / 44 * 6.283, rr = r + Math.sin(t * 3 + k) * 3 + (Math.random() - .5) * 2; i ? g.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr * 0.92) : g.moveTo(x + rr, y); } g.stroke(); } };
  ring(1040, 130, 62); ring(760, 640, 36);
  g.strokeStyle = 'rgba(31,61,158,.10)'; g.lineWidth = 14; g.lineCap = 'round'; g.beginPath(); g.moveTo(880, 470); g.quadraticCurveTo(960, 490, 1010, 540); g.stroke();
  for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(60,60,70,${Math.random() * 0.06})`; g.lineWidth = 1; g.beginPath(); g.moveTo(870 + Math.random() * 60, 620 + Math.random() * 50); g.lineTo(880 + Math.random() * 60, 630 + Math.random() * 50); g.stroke(); }
}

const GAMES = [
  { title: 'Doodle Slingshot', href: 'games/slingshot/index.html', cx: 262, cy: 335, w: 330, h: 175, rot: -0.04, above: 'angry birds', note: 'fling doodles at towers. 9 pages. red pen at the end!!', quip: "this one's got a BOSS", preview: previewSlingshot, color: INK },
  { title: "X's & O's Football", href: 'games/xo-football/index.html', cx: 640, cy: 300, w: 340, h: 180, rot: 0.05, above: 'retro bowl', note: 'draw the play, hike, throw, run. now with DEFENSE', quip: 'draw your own plays!!', preview: previewFootball, color: INK },
  { title: 'Doodle Ballpark', href: 'games/baseball/index.html', cx: 975, cy: 355, w: 320, h: 180, rot: -0.03, above: 'baseball 9', note: 'time the swing, pick the pitch, 3 innings vs the pencils', quip: 'home runs go 550 ft here', preview: previewBaseball, color: INK },
  { title: 'Paper Football', href: 'games/paper-football/index.html', cx: 560, cy: 585, w: 290, h: 150, rot: 0.03, above: 'meh', note: 'flick the triangle. hang it off the edge. kick it through', quip: 'ok this one is kinda simple', preview: previewPaperFootball, color: INK },
];
let frame = 0, introT = 0, hover = -1, mouse = { x: -1, y: -1 }, trail = [], plane = { t: -1 }, leaving = -1, leaveT = 0, quipT = 0;
const rv = (s, d) => Math.max(0, Math.min(1, (introT - s) / d));

function inScene(g, x, y) { const dx = (x - g.cx) / (g.w / 2 + 14), dy = (y - g.cy) / (g.h / 2 + 30); return dx * dx + dy * dy <= 1; }

// ---------- pieces ----------
function blob(cx, cy, rx, ry, id, color, width, passes = 2, prog = 1) { // a loose scribbled loop, drawn twice like a pen going around again
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let p = 0; p < passes; p++) {
    if (prog < 1 && p > 0) break;
    ctx.lineWidth = width * (0.8 + ink.rnd(id + p) * 0.4); ctx.globalAlpha = 0.85; ctx.beginPath();
    const n = 34, stop = Math.round(n * prog + 2), st = ink.rnd(id + p * 3) * 6.28;
    for (let i = 0; i <= stop; i++) { const t = st + i / n * 6.283 * 1.06; const wob = 1 + Math.sin(t * 5 + id) * 0.04 + (ink.rnd(id * 7 + i + p * 50) - 0.5) * 0.05; const x = cx + Math.cos(t) * rx * wob + (p ? 3 : 0), y = cy + Math.sin(t) * ry * wob + (p ? -2 : 0); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function crossout(x, y, w, id) { ink.line(x - 4, y - 2, x + w + 4, y - 5, id, RED, 2, 1); ink.line(x - 2, y + 2, x + w + 2, y - 1, id + 1, RED, 1.4, 1); }
function arrow(pts, id, color = INK, width = 2) { ink.path(pts, id, color, width, 1); const a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b.y - a.y, b.x - a.x); ink.line(b.x, b.y, b.x - Math.cos(ang - 0.5) * 13, b.y - Math.sin(ang - 0.5) * 13, id + 90, color, width, 1); ink.line(b.x, b.y, b.x - Math.cos(ang + 0.5) * 13, b.y - Math.sin(ang + 0.5) * 13, id + 91, color, width, 1); }
function tape(x, y, w, rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = 'rgba(255,238,170,.7)'; ctx.fillRect(-w / 2, -9, w, 18); ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.strokeRect(-w / 2, -9, w, 18); ctx.restore(); }
function star(x, y, r, id, color = INK) { for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3 + 0.3; ink.line(x - Math.cos(a) * r, y - Math.sin(a) * r, x + Math.cos(a) * r, y + Math.sin(a) * r, id + k, color, 1.6, 1); } }

// ---------- the wordmark sticker ----------
function wordmark(prog) {
  ctx.save(); ctx.translate(300, 100); ctx.rotate(-0.045);
  // scribble patch behind it, like it was colored in with the side of a highlighter
  ctx.fillStyle = HILITE; ctx.globalAlpha = Math.min(1, prog * 2); ctx.beginPath(); ctx.moveTo(-250, -46); ctx.lineTo(258, -56); ctx.lineTo(252, 52); ctx.lineTo(-244, 60); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  tape(-180, -54, 90, -0.3); tape(200, 50, 80, 0.4);
  if (logoCut) { ctx.globalAlpha = Math.max(0, Math.min(1, (prog - 0.2) / 0.5)); ctx.drawImage(logoCut, -240, -80, 480, 480 * logoCut.height / logoCut.width); ctx.globalAlpha = 1; }
  else { ink.setAlpha(Math.max(0, Math.min(1, (prog - 0.2) / 0.5))); ink.text('NOTEBOOK', 0, -8, { size: 72, color: INK }); ink.text('ARCADE', 6, 52, { size: 66, color: RED }); ink.setAlpha(1); }
  if (prog > 0.8) { star(-262, -70, 8, 20); star(272, -60, 7, 24); star(-270, 74, 6, 28); ink.text('vol. 1', 240, -78, { size: 20, color: RED, rot: 0.3 }); }
  ctx.restore();
  if (prog > 0.9) { ink.text('property of:', 60, 190, { size: 18, color: PEN_MD, font: 'Patrick Hand', weight: 400, align: 'left' }); ink.longLine(150, 194, 330, 191, 30, PEN_LT, 1, 1, 1); ink.text('ME. hands off', 160, 187, { size: 22, color: INK, align: 'left', rot: -0.05 }); ink.text('(this means you, pencils)', 340, 191, { size: 14, color: RED, font: 'Patrick Hand', weight: 400, align: 'left', rot: -0.04 }); }
}

// ---------- a game, doodled onto the page ----------
function drawScene(g, i) {
  const pr = rv(30 + i * 22, 40); if (pr <= 0) return;
  const hov = hover === i, lv = leaving === i ? Math.min(1, leaveT / 14) : 0;
  ctx.save(); ctx.translate(g.cx, g.cy); ctx.rotate(g.rot + (hov ? Math.sin(frame * 0.12) * 0.01 : 0)); if (lv) ctx.scale(1 + lv * 0.25, 1 + lv * 0.25);
  const rx = g.w / 2, ry = g.h / 2;
  // shadow hatch under the blob, then the paper patch, then the scene clipped inside
  ink.setAlpha(pr * 0.5); ink.hatch(Array.from({ length: 20 }, (_, k) => ({ x: 8 + Math.cos(k / 20 * 6.283) * rx, y: 10 + Math.sin(k / 20 * 6.283) * ry })), 400 + i, GRAPHITE, 5, 0.8, 0.35); ink.setAlpha(1);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, 7); ctx.clip();
  ctx.fillStyle = 'rgba(253,251,244,.9)'; ctx.fillRect(-rx, -ry, rx * 2, ry * 2);
  const reveal = Math.max(0, (pr - 0.3) / 0.7); ctx.beginPath(); ctx.arc(0, 0, Math.max(1, reveal * (rx + 20)), 0, 7); ctx.clip();
  ctx.translate(-rx + 12, -ry + 10); g.preview(rx * 2 - 24, ry * 2 - 20, hov);
  ctx.restore();
  blob(0, 0, rx, ry, 300 + i * 3, hov ? RED : g.color, hov ? 3.2 : 2.4, 2, pr);
  if (hov) blob(0, 0, rx + 8, ry + 8, 310 + i * 3, RED, 1.2, 1, 1);
  // title, with what it was almost called crossed out above it
  if (pr > 0.6) {
    ink.text(g.above, -rx + 50, -ry - 30, { size: 16, color: PEN_MD, font: 'Patrick Hand', weight: 400, align: 'left', rot: -0.06 });
    crossout(-rx + 50, -ry - 34, g.above.length * 8, 330 + i);
    ink.text(g.title, -rx + 44, -ry - 30 + 26, { size: 34, color: hov ? RED : INK, align: 'left', rot: -0.03 });
    ink.longLine(-rx + 44, -ry + 2, -rx + 44 + Math.min(rx * 2 - 80, g.title.length * 14), -ry - 1, 340 + i, hov ? RED : INK, 1.8, 1, 1.4);
    ink.text(g.note, -rx + 10, ry + 22, { size: 14, color: PEN_DK, font: 'Patrick Hand', weight: 400, align: 'left', rot: 0.01 });
    ink.text(String(i + 1) + '.', -rx + 14, -ry - 4, { size: 34, color: RED, rot: -0.1 });
  }
  if (hov) { ink.text('PLAY THIS ONE', rx - 40, ry + 6, { size: 22, color: RED, rot: -0.12 }); arrow([{ x: rx - 60, y: ry + 22 }, { x: rx - 30, y: ry + 8 }, { x: rx - 12, y: ry - 12 }], 350 + i, RED, 2); }
  ctx.restore();
}

// ---------- living previews (drawn inside each blob) ----------
function previewSlingshot(w, h, hov) {
  const speed = hov ? 1.7 : 1, t = ((frame * speed) % 260) / 260, ground = h - 18;
  ink.line(6, ground, w - 6, ground, 200, INK, 2, 1); for (let x = 12; x < w; x += 22) ink.line(x, ground, x + 3, ground - 6, 201 + x, INK, 1, 1);
  ink.line(34, ground, 34, ground - 34, 202, INK, 3, 1); ink.line(34, ground - 34, 26, ground - 48, 203, INK, 3, 1); ink.line(34, ground - 34, 42, ground - 48, 204, INK, 3, 1);
  const tx = w - 60, fallen = t > 0.62, f = fallen ? Math.min(1, (t - 0.62) / 0.15) : 0;
  const blk = (x, y, bw, bh, ang, id) => { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); const q = [{ x: -bw / 2, y: -bh / 2 }, { x: bw / 2, y: -bh / 2 }, { x: bw / 2, y: bh / 2 }, { x: -bw / 2, y: bh / 2 }]; ink.hatch(q, id, INK, 5, 0.8, 0.4); ink.poly(q, id, INK, 1.6, 1); ctx.restore(); };
  blk(tx - 16, ground - 16 + f * 4, 8, 32, f * 0.9, 210); blk(tx + 16, ground - 16 + f * 4, 8, 32, -f * 0.7, 211); blk(tx + f * 22, ground - 36 + f * 26, 44, 8, f * 0.6, 212);
  const mx = tx + f * 30, my = ground - 46 + f * 34; ink.circle(mx, my, 8, 213, RED, 1.8, 1); for (const ex of [-3, 3]) { ink.line(mx + ex - 1.5, my - 3, mx + ex + 1.5, my, 214 + ex, RED, 1.2, 1); ink.line(mx + ex + 1.5, my - 3, mx + ex - 1.5, my, 216 + ex, RED, 1.2, 1); }
  let bx = 34, by = ground - 44;
  if (t < 0.25) { const u = t / 0.25; bx = 34 - u * 22; by = ground - 44 + u * 12; ink.line(26, ground - 48, bx, by, 220, RED, 1.5, 1); ink.line(42, ground - 48, bx, by, 221, RED, 1.5, 1); }
  else if (t < 0.62) { const u = (t - 0.25) / 0.37; bx = 12 + (tx - 12) * u; by = ground - 32 - Math.sin(u * Math.PI) * 70; ctx.fillStyle = INK; ctx.globalAlpha = 0.3; for (let k = 0; k < 8; k++) { const uu = u * k / 8; ctx.beginPath(); ctx.arc(12 + (tx - 12) * uu, ground - 32 - Math.sin(uu * Math.PI) * 70, 1.5, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
  else { bx = tx + 8 + f * 10; by = ground - 10; }
  ink.circle(bx, by, 8, 222, INK, 2, 1); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(bx - 3, by - 2, 1.2, 0, 7); ctx.arc(bx + 3, by - 2, 1.2, 0, 7); ctx.fill(); ink.line(bx - 5, by - 6, bx - 2, by - 4, 223, INK, 1.2, 1); ink.line(bx + 5, by - 6, bx + 2, by - 4, 224, INK, 1.2, 1);
  if (fallen && f >= 1) ink.text('+100', tx + 10, ground - 62, { size: 16, color: RED, rot: -0.1, alpha: 1 - (t - 0.77) / 0.23 });
}
function previewFootball(w, h, hov) {
  const speed = hov ? 1.6 : 1, t = ((frame * speed) % 300) / 300;
  for (let y = 18; y < h; y += 28) ink.line(10, y, w - 10, y, 240 + y, INK, 1, 1);
  ink.line(10, 6, 10, h - 6, 241, INK, 2, 1); ink.line(w - 10, 6, w - 10, h - 6, 242, INK, 2, 1);
  const los = h - 52; ink.line(10, los, w - 10, los, 243, INK, 1.6, 1); ink.line(10, los - 40, w - 10, los - 40, 244, RED, 1.6, 1);
  const O = (x, y, id) => ink.circle(x, y, 7, id, INK, 2, 1), X = (x, y, id) => { ink.line(x - 5, y - 5, x + 5, y + 5, id, PEN_DK, 2, 1); ink.line(x + 5, y - 5, x - 5, y + 5, id + 1, PEN_DK, 2, 1); };
  [[w / 2 - 22, los + 8], [w / 2, los + 8], [w / 2 + 22, los + 8], [w / 2, los + 28], [w / 2, los + 46]].forEach(([x, y], k) => O(x, y, 250 + k));
  [[w / 2 - 22, los - 12], [w / 2, los - 12], [w / 2 + 22, los - 12], [w / 2 + 30, los - 40]].forEach(([x, y], k) => X(x, y, 260 + k * 2));
  const rx = w - 44, ry = los + 8, route = [{ x: rx, y: ry }, { x: rx, y: ry - 56 }, { x: rx - 70, y: ry - 100 }], draw = Math.min(1, t / 0.3);
  ink.line(route[0].x, route[0].y - 8, route[1].x, route[1].y, 270, INK, 2, 1, draw * 2); ink.line(route[1].x, route[1].y, route[2].x, route[2].y, 271, INK, 2, 1, draw * 2 - 1);
  if (draw >= 1) { ink.line(route[2].x, route[2].y, route[2].x + 9, route[2].y - 2, 272, INK, 2, 1); ink.line(route[2].x, route[2].y, route[2].x + 4, route[2].y + 9, 273, INK, 2, 1); }
  let px = rx, py = ry, cx = rx, cy = ry - 26;
  if (t > 0.38) { const u = Math.min(1, (t - 0.38) / 0.45), seg = u < 0.5 ? 0 : 1, lu = seg ? (u - 0.5) * 2 : u * 2, a = route[seg], b = route[seg + 1]; px = a.x + (b.x - a.x) * lu; py = a.y + (b.y - a.y) * lu; cx = px + 4 + (1 - u) * 6; cy = py - 22 + u * 12; }
  O(px, py, 280); X(cx, cy, 282);
  if (t > 0.55 && t < 0.83) { const u = (t - 0.55) / 0.28, qx = w / 2, qy = los + 28, bx = qx + (px - qx) * u, by = qy + (py - qy) * u - Math.sin(u * Math.PI) * 30; ctx.fillStyle = BROWN; ctx.beginPath(); ctx.ellipse(bx, by, 5, 3, 0.5, 0, 7); ctx.fill(); }
  if (t > 0.86) ink.text('catch!', px - 20, py - 16, { size: 15, color: INK, font: 'Patrick Hand', weight: 400, rot: -0.1 });
}
function previewBaseball(w, h, hov) {
  const speed = hov ? 1.6 : 1, t = ((frame * speed) % 280) / 280, hx = w / 2, hy = h - 22, d = 44;
  ink.poly([{ x: hx, y: hy }, { x: hx + d, y: hy - d }, { x: hx, y: hy - 2 * d }, { x: hx - d, y: hy - d }], 300, INK, 1.6, 1);
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.8; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(hx, hy, d * 2.5, -2.36, -0.78); ctx.stroke(); ctx.globalAlpha = 1;
  ink.circle(hx, hy - d - 8, 5, 301, BROWN, 1.3, 1);
  let bx = hx, by = hy - d - 8; const swing = t > 0.42 && t < 0.52;
  if (t < 0.42) { const u = t / 0.42; by = hy - d - 8 + (hy - 6 - (hy - d - 8)) * Math.pow(u, 1.3); }
  else if (t < 0.85) { const u = (t - 0.42) / 0.43; bx = hx + u * 70; by = hy - 6 - u * (2.3 * d) - Math.sin(u * Math.PI) * 40; ctx.fillStyle = INK; ctx.globalAlpha = 0.3; for (let k = 0; k < 8; k++) { const uu = u * k / 8; ctx.beginPath(); ctx.arc(hx + uu * 70, hy - 6 - uu * (2.3 * d) - Math.sin(uu * Math.PI) * 40, 1.4, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
  else bx = -50;
  const ang = swing ? -2.4 + ((t - 0.42) / 0.1) * 2.6 : (t >= 0.52 ? 0.3 : -2.4);
  ink.circle(hx - 18, hy + 2, 6, 302, INK, 2, 1); ink.line(hx - 12, hy - 2, hx - 12 + Math.cos(ang) * 26, hy - 2 + Math.sin(ang) * 26, 303, INK, 3, 1);
  if (bx > -20) { ctx.fillStyle = '#fbf8ee'; ctx.strokeStyle = PEN_DK; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx, by, 4, 0, 7); ctx.fill(); ctx.stroke(); }
  if (t > 0.5 && t < 0.62) ink.text('CRACK!', hx + 30, hy - 40, { size: 18, color: RED, rot: -0.15 });

// ---------- margins: the mascot with a sign, notes, tallies, the pencils' crest ----------
function drawFan(x, baseY, mood) {

  ctx.fillStyle = '#fbf8ee'; ctx.fillRect(x - 6, baseY - 84, 84, 42); ink.poly([{ x: x - 6, y: baseY - 84 }, { x: x + 78, y: baseY - 84 }, { x: x + 78, y: baseY - 42 }, { x: x - 6, y: baseY - 42 }], id + 13, PEN_DK, 1.6, 1);
  ink.text(mood ? 'THAT ONE!' : 'PICK ONE', x + 36, baseY - 56, { size: 20, color: RED, rot: -0.05 });
  if (mood) { const a2y = baseY - 6 + Math.sin(frame * 0.35) * 6; ink.line(sh.x, sh.y, x - 18, a2y, id + 14, col, w, 1); } else ink.line(sh.x, sh.y, x - 14, baseY + 31, id + 14, col, w, 1);
}
function drawMargins() {
  const pr = rv(120, 40); if (pr <= 0) return; ink.setAlpha(pr);

  const nx = 1030, ny = 508;
  ink.text('to do:', nx, ny, { size: 20, color: PEN_DK, font: 'Patrick Hand', weight: 400, align: 'left', rot: -0.04 });
  [['math hw', true], ['beat the pencils', false], ['call mom', true], ['stop doodling', true]].forEach(([t, done], k) => { const y = ny + 26 + k * 24; ink.poly([{ x: nx, y: y - 12 }, { x: nx + 12, y: y - 12 }, { x: nx + 12, y }, { x: nx, y }], 600 + k * 5, PEN_MD, 1.2, 1); if (done) { ink.line(nx + 2, y - 6, nx + 6, y - 1, 605 + k * 5, INK, 2, 1); ink.line(nx + 6, y - 1, nx + 14, y - 14, 606 + k * 5, INK, 2, 1); } ink.text(t, nx + 20, y - 1, { size: 16, color: done ? PEN_LT : PEN_DK, font: 'Patrick Hand', weight: 400, align: 'left' }); if (done && k === 3) crossout(nx + 20, y - 4, 96, 640); });
  // the pencils: a shield with crossed pencils, and the season record in tally marks

  ink.poly([{ x: sx - 34, y: sy - 30 }, { x: sx + 34, y: sy - 30 }, { x: sx + 30, y: sy + 16 }, { x: sx, y: sy + 40 }, { x: sx - 30, y: sy + 16 }], 650, PEN_DK, 2, 2);
  ink.line(sx - 20, sy - 18, sx + 18, sy + 22, 655, PEN_DK, 3, 1); ink.line(sx + 20, sy - 18, sx - 18, sy + 22, 656, PEN_DK, 3, 1); ink.line(sx - 20, sy - 18, sx - 24, sy - 26, 657, RED, 2, 1); ink.line(sx + 20, sy - 18, sx + 24, sy - 26, 658, RED, 2, 1);
  ink.text('THE PENCILS', sx, sy - 40, { size: 16, color: PEN_DK, rot: 0.04 }); ink.text('(boo)', sx + 48, sy - 2, { size: 14, color: RED, font: 'Patrick Hand', weight: 400, rot: 0.2 });
  ink.text('record vs them:', sx - 60, sy + 70, { size: 14, color: PEN_MD, font: 'Patrick Hand', weight: 400, align: 'left' });
  for (let k = 0; k < 7; k++) { const tx = sx - 56 + k * 9 + (k >= 5 ? 8 : 0); ink.line(tx, sy + 80, tx + 1, sy + 96, 660 + k, INK, 1.8, 1); if (k === 4) ink.line(sx - 58, sy + 94, sx - 18, sy + 82, 668, INK, 1.8, 1); }
  ink.text('W', sx + 22, sy + 94, { size: 14, color: PEN_MD, font: 'Patrick Hand', weight: 400 });
  // random doodles: a sun, a rocket, a smiley, "GO TEAM"
  ink.circle(1150, 62, 16, 670, INK, 1.8, 1); for (let k = 0; k < 8; k++) { const a = k / 8 * 6.283; ink.line(1150 + Math.cos(a) * 22, 62 + Math.sin(a) * 22, 1150 + Math.cos(a) * 32, 62 + Math.sin(a) * 32, 671 + k, INK, 1.4, 1); }
  ink.text('GO TEAM!!!', 880, 160, { size: 24, color: RED, rot: -0.18 }); ink.longLine(842, 170, 950, 146, 680, RED, 1.6, 1, 1.5);
  ink.poly([{ x: 1130, y: 640 }, { x: 1150, y: 600 }, { x: 1170, y: 640 }, { x: 1150, y: 650 }], 690, INK, 1.6, 1); ink.line(1150, 650, 1146, 668, 691, RED, 2, 1); ink.line(1150, 650, 1154, 668, 692, RED, 2, 1);
  ink.text('next page?', 1110, 690, { size: 18, color: PEN_MD, font: 'Patrick Hand', weight: 400, rot: 0.05 });

}

// ---------- ambient: pencil trail, a paper plane ----------
function drawTrail() {
  trail = trail.filter(p => --p.life > 0); if (trail.length < 2) return;
  ctx.strokeStyle = GRAPHITE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < trail.length; i++) { ctx.globalAlpha = Math.min(0.5, trail[i].life / 60 * 0.5); ctx.lineWidth = 1 + trail[i].life / 60; ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function drawPlane() {
  if (plane.t < 0) { if (frame > 600 && frame % 1100 === 0) plane.t = 0; return; }
  plane.t++; const u = plane.t / 320; if (u > 1) { plane.t = -1; return; }
  const x = -40 + u * (W + 80), y = 210 + Math.sin(u * 4) * 40 + u * 60, ang = Math.cos(u * 4) * 0.35 + 0.15;
  ctx.fillStyle = INK; ctx.globalAlpha = 0.25; for (let k = 1; k < 14; k++) { const uu = u - k * 0.012; if (uu < 0) break; ctx.beginPath(); ctx.arc(-40 + uu * (W + 80), 210 + Math.sin(uu * 4) * 40 + uu * 60, 1.4, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;

}

// ---------- input ----------
function pos(e) { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height }; }
canvas.addEventListener('mousemove', e => {
  const p = pos(e); if (mouse.x >= 0 && Math.hypot(p.x - mouse.x, p.y - mouse.y) > 2) trail.push({ x: p.x, y: p.y, life: 60 }); mouse = p;
  const h = GAMES.findIndex(g => inScene(g, p.x, p.y)); if (h !== hover) { hover = h; if (h >= 0) { SFX.tick(); quipT = 0; } }
  canvas.style.cursor = hover >= 0 ? 'pointer' : 'default';
});
canvas.addEventListener('mouseleave', () => { hover = -1; mouse = { x: -1, y: -1 }; });
function onDown(e) { const p = pos(e); const i = GAMES.findIndex(g => inScene(g, p.x, p.y)); if (i >= 0 && leaving < 0) { leaving = i; leaveT = 0; SFX.flip(); setTimeout(() => { location.href = GAMES[i].href; }, 260); e.preventDefault(); } }
canvas.addEventListener('mousedown', onDown); canvas.addEventListener('touchstart', onDown, { passive: false });

// ---------- loop ----------
buildPaper(); setTimeout(() => SFX.scratch(), 300);
function tick() {
  frame++; if (introT < 260) introT++; if (leaving >= 0) leaveT++; quipT++;
  ctx.drawImage(paper, 0, 0);
  wordmark(rv(0, 50));
  drawMargins();
  GAMES.forEach((g, i) => { if (i !== hover) drawScene(g, i); }); if (hover >= 0) drawScene(GAMES[hover], hover);
  if (introT > 100) { drawFan(150, 590, hover >= 0); if (hover >= 0 && quipT > 10) ink.text(GAMES[hover].quip, 160, 672, { size: 18, color: PEN_DK, font: 'Patrick Hand', weight: 400, rot: -0.04, alpha: Math.min(1, (quipT - 10) / 15) }); }
  drawPlane(); drawTrail();
